<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Attract demo, Gap Guard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
a{color:#3DD6C0}a:hover{color:#FFD23F}
</style>
</helmet>
<div style="width: 760px; height: 640px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 14px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; border: 4px solid #2A2440; font-family: 'Pixelify Sans', 'Gowun Dodum', sans-serif; color: #FBF7FC;">
  <div style="display: flex; gap: 8px; align-items: center;">
    <button style="padding: 6px 12px; font: inherit; font-size: 16px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD;">Word Strike</button>
    <button style="padding: 6px 12px; font: inherit; font-size: 16px; color: #2A2440; background: #FFD23F; border: 4px solid #FFD23F;">Gap Guard</button>
  </div>
  <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 18px; font-weight: 700; color: #3DD6C0;">YOU</span>
      <span style="display: flex; gap: 4px;">
        <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3DD6C0" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
        <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3DD6C0" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
        <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3DD6C0" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
      </span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; line-height: 1;">
      <span style="font-size: 12px; color: #D6C9DD; margin-bottom: 4px;">BEST 0000</span>
      <span style="font-size: 32px; font-weight: 700; color: #FFD23F;">0010</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; justify-content: flex-end;">
      <span style="display: flex; gap: 4px;">
        <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FF4D6D" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
        <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FF4D6D" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
        <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="rgba(214,201,221,0.22)" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path></svg>
      </span>
      <span style="font-size: 18px; font-weight: 700; color: #FF4D6D;">CPU 1</span>
    </div>
  </div>
  <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; background: #FBF7FC; color: #2A2440; border: 4px solid #2A2440; box-shadow: 6px 6px 0 rgba(0,0,0,0.35); overflow: hidden;">
    <span style="position: absolute; top: 10px; left: 12px; padding: 2px 8px; font-size: 13px; letter-spacing: 2px; color: #FBF7FC; background: #2A2440;">DEMO</span>
    <span style="position: absolute; top: 10px; right: 14px; font-size: 22px; font-weight: 700; color: #3DD6C0;">+10</span>
    <span style="font-size: 13px; letter-spacing: 2px; color: #6B5F7D; opacity: 0.6;">FILL THE GAP</span>
    <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 60px; line-height: 1.15; opacity: 0.6;">저는 사과<span style="color: #1E9C8A; border-bottom: 6px solid #1E9C8A;">를</span> 먹어요.</span>
    <span style="font-family: 'Gowun Dodum', sans-serif; font-size: 18px; color: #5B5070; opacity: 0.6;">I eat an apple.</span>
    <div style="position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); padding: 14px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; background: #FFD23F; border-top: 4px solid #2A2440; border-bottom: 4px solid #2A2440;">
      <span style="font-size: 40px; font-weight: 700; letter-spacing: 6px;">PRESS START</span>
      <span style="font-size: 15px; letter-spacing: 1px;">Pick the missing piece · keys 1, 2, 3</span>
    </div>
    <span style="position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-family: 'Gowun Dodum', sans-serif; font-size: 15px; color: #6B5F7D;">Tip: 을 follows a consonant, 를 follows a vowel.</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; opacity: 0.6;">
    <button disabled lang="ko" style="padding: 12px 8px; font-family: 'Gowun Dodum', sans-serif; font-size: 26px; color: #2A2440; background: #3DD6C0; border: 4px solid #2A2440;">를</button>
    <button disabled lang="ko" style="padding: 12px 8px; font-family: 'Gowun Dodum', sans-serif; font-size: 26px; color: #2A2440; background: #FBF7FC; border: 4px solid #2A2440;">을</button>
    <button disabled lang="ko" style="padding: 12px 8px; font-family: 'Gowun Dodum', sans-serif; font-size: 26px; color: #2A2440; background: #FBF7FC; border: 4px solid #2A2440;">가</button>
  </div>
  <button style="padding: 12px; font-family: 'Pixelify Sans', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 3px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #000;">START</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":640}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
