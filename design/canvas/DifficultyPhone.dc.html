<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone · Difficulty A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 20px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC; overflow: hidden;">

  <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 10px;">
    <a href="#" aria-label="Wordbook" style="width: 44px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 4px solid #D6C9DD;">
      <svg width="21" height="18" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#D6C9DD" d="M0 0h3v1h-3zM4 0h3v1h-3zM0 1h1v4h-1zM3 1h1v5h-1zM6 1h1v4h-1zM0 5h3v1h-3zM4 5h3v1h-3z"></path><path fill="#FFD23F" d="M1 1h2v4h-2zM4 1h2v4h-2z"></path></svg>
    </a>
    <h1 style="margin: 0; text-align: center; font-size: 20px; font-weight: 700; letter-spacing: 3px; white-space: nowrap;">WORD DUEL</h1>
    <button style="min-height: 44px; padding: 0 10px; font-family: 'Pixelify Sans', sans-serif; font-size: 14px; letter-spacing: 1px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">SIGN IN</button>
  </div>

  <section aria-label="Word Strike" style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 16px; color: #2A2440; background: #FBF7FC; border: 4px solid #FFD23F; box-shadow: 8px 8px 0 #FFD23F;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px; background: #EFE6F2;">
      <span style="font-family: 'Jua', sans-serif; font-size: 56px; line-height: 1;">water</span>
      <span style="display: flex; align-items: center; width: 80%; box-sizing: border-box; padding: 6px 12px; background: #FBF7FC; border: 4px solid #3DD6C0;">
        <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 26px;">물</span>
        <span style="width: 4px; height: 26px; margin-left: 4px; background: #2A2440;"></span>
      </span>
    </div>
    <span style="font-size: 28px; font-weight: 700; letter-spacing: 2px;">WORD STRIKE</span>
    <span style="font-family: 'Jua', sans-serif; font-size: 16px; line-height: 1.4; color: #4A4060;">See a word, type its translation, hit Enter before time runs out.</span>
    <div role="radiogroup" aria-label="Difficulty" style="display: flex;">
      <sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{l.on}}" onClick="{{l.pick}}" style="flex: 1 1 0; min-height: 44px; margin-left: {{l.ml}}; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: 'Pixelify Sans', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #2A2440; background: {{l.bg}}; border: 4px solid #2A2440; cursor: pointer;">
          <span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 2px; height: 12px;">
            <span style="width: 4px; height: 4px; background: {{l.bar1}};"></span>
            <span style="width: 4px; height: 8px; background: {{l.bar2}};"></span>
            <span style="width: 4px; height: 12px; background: {{l.bar3}};"></span>
          </span>
          {{l.name}}
        </button>
      </sc-for>
    </div>
    <span style="font-family: 'Jua', sans-serif; font-size: 15px; line-height: 1.4; color: #4A4060;">{{blurb}}</span>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="padding: 5px 10px; font-size: 14px; border: 3px solid #2A2440;">EN &gt; <span lang="ko">한</span></span>
      <span style="width: 36px; height: 36px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; border: 3px solid #2A2440;">?</span>
      <span style="margin-left: auto; padding: 8px 20px; font-size: 18px; font-weight: 700; letter-spacing: 2px; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #000;">PLAY</span>
    </div>
  </section>

  <div style="display: flex; align-items: center; justify-content: center; gap: 18px;">
    <span style="width: 44px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 4px solid #D6C9DD;">&lt;</span>
    <span style="display: flex; gap: 8px;"><span style="width: 12px; height: 12px; background: #FFD23F;"></span><span style="width: 12px; height: 12px; background: #6B5F7D;"></span></span>
    <span style="width: 44px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 18px; border: 4px solid #D6C9DD;">&gt;</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const pick = this.state.level ?? 1;
const names = ['EASY', 'NORMAL', 'HARD'];
const blurbs = [
'Everyday words only. 10 points each.',
'Everyday and common words. Common ones are worth 20.',
'Every word, rare ones too. Rare ones are worth 30.'
];
const accent = ['#3DD6C0', '#FFD23F', '#FF4D6D'];
const levels = names.map((name, i) => {
const on = i === pick;
const bar = (n) => (n <= i ? (on ? '#2A2440' : '#6B5F7D') : (on ? 'rgba(42,36,64,0.25)' : '#D6C9DD'));
return {
name,
ml: i === 0 ? '0' : '-4px',
on: on ? 'true' : 'false',
bg: on ? accent[i] : '#FBF7FC',
bar1: bar(0), bar2: bar(1), bar3: bar(2),
pick: () => this.setState({ level: i })
};
});
return { levels, blurb: blurbs[pick] };
}
}
</script>
</body>
</html>
