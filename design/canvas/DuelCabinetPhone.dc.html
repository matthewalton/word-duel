<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duel screen, one cabinet, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 10px 16px; display: flex; flex-direction: column; gap: 10px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC;">

  <div style="display: flex; align-items: center; gap: 8px;">
    <button style="min-height: 44px; padding: 4px 8px; font-family: 'Pixelify Sans', sans-serif; font-size: 13px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&lt; MENU</button>
    <span style="font-size: 15px; font-weight: 700; letter-spacing: 1px;">WORD STRIKE</span>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 5px; padding: 3px 7px; font-family: 'Jua', sans-serif; font-size: 13px; color: #3DD6C0; border: 3px solid #3DD6C0;">EN <svg width="8" height="8" viewBox="0 0 5 5" shape-rendering="crispEdges" role="img" aria-label="to"><path fill="currentColor" d="M0 2h4v1h-4zM2 0h1v1h-1zM3 1h1v1h-1zM4 2h1v1h-1zM3 3h1v1h-1zM2 4h1v1h-1z"></path></svg> <span lang="ko">한</span></span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 6px 6px 0 #000;">

    <div style="background: #2A2440;">
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: end; padding: 10px 12px 8px;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 13px; font-weight: 700; color: #3DD6C0;">YOU</span>
          <span role="img" aria-label="You: {{heartsLeft}} of 3 hearts" style="display: flex; gap: 2px;">
            <sc-for list="{{hearts}}" as="h" hint-placeholder-count="3">
              <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{h.fill}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="{{h.hl}}"></rect></svg>
            </sc-for>
          </span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; line-height: 1;">
          <span style="font-size: 11px; color: #D6C9DD; margin-bottom: 3px;">BEST 1210</span>
          <span style="font-size: 26px; font-weight: 700; color: #FFD23F;">{{score}}</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
          <span style="font-size: 13px; font-weight: 700;">STAGE 2</span>
          <span role="img" aria-label="{{stepsDone}} of 3 steps to stage 3" style="display: flex; align-items: flex-end; gap: 2px; height: 24px;">
            <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
              <span style="width: 13px; height: {{s.h}}; box-sizing: border-box; background: {{s.bg}}; border: 3px solid {{s.border}};"></span>
            </sc-for>
            <svg width="15" height="18" viewBox="0 0 5 6" shape-rendering="crispEdges" aria-hidden="true" style="margin-left: 2px;"><path fill="#D6C9DD" d="M0 0h1v6h-1z"></path><path fill="#FF4D6D" d="M1 0h4v3h-4z"></path></svg>
          </span>
        </div>
      </div>
      <div role="meter" aria-label="Fuse" aria-valuemin="0" aria-valuemax="20" aria-valuenow="{{lit}}" style="display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 2px; height: 10px; padding: 0 12px 8px;">
        <sc-for list="{{fuse}}" as="f" hint-placeholder-count="20">
          <span style="background: {{f.bg}};"></span>
        </sc-for>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #2A2440;">
      <span style="font-size: 12px; letter-spacing: 2px; color: #6B5F7D;">TYPE IT IN KOREAN</span>
      <span style="font-family: 'Jua', sans-serif; font-size: 64px; line-height: 1.2; color: {{promptColor}};">picnic</span>
    </div>

    <div role="status" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 10px; min-height: 52px; padding: 8px 12px; box-sizing: border-box; font-size: 14px; color: #2A2440; background: {{feedBg}}; border-top: 4px solid #2A2440;">
      <sc-if value="{{isPlaying}}" hint-placeholder-val="{{ false }}">
        <span style="color: #6B5F7D;">ENTER TO HIT</span>
      </sc-if>
      <sc-if value="{{isMiss}}" hint-placeholder-val="{{ true }}">
        <span>NOT QUITE. IT WAS</span>
        <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 24px; line-height: 1; color: #FBF7FC; background: #2A2440; padding: 3px 8px;">소풍</span>
      </sc-if>
      <sc-if value="{{isHit}}" hint-placeholder-val="{{ false }}">
        <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 20px;">잘했어요!</span>
        <span>+20</span>
      </sc-if>
    </div>

    <div style="display: flex; border-top: 4px solid #2A2440;">
      <label for="cabp-answer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Your answer</label>
      <input id="cabp-answer" readonly value="{{typed}}" placeholder="Type in Korean" lang="ko" style="flex-grow: 1; min-width: 0; padding: 12px 14px; font-family: 'Jua', sans-serif; font-size: 22px; color: #2A2440; background: #FFFFFF; border: 0; outline: none;">
      <button style="padding: 0 20px; font-family: 'Pixelify Sans', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 1px; color: #2A2440; background: #FFD23F; border: 0; border-left: 4px solid #2A2440; cursor: pointer;">HIT</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"moment":{"editor":"enum","options":["miss","playing","hit"],"default":"miss"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const m = this.props.moment || 'miss';
const heartsLeft = m === 'miss' ? 1 : 2;
const stepsDone = m === 'hit' ? 2 : 1;
const lit = m === 'playing' ? 13 : m === 'hit' ? 9 : 0;
return {
isMiss: m === 'miss', isPlaying: m === 'playing', isHit: m === 'hit',
heartsLeft: heartsLeft, stepsDone: stepsDone, lit: lit,
hearts: [0, 1, 2].map((i) => ({ fill: i < heartsLeft ? '#3DD6C0' : '#4E4670', hl: i < heartsLeft ? '#FFFFFF' : '#4E4670' })),
steps: [0, 1, 2].map((i) => ({ h: (10 + i * 7) + 'px', bg: i < stepsDone ? '#FFD23F' : 'transparent', border: i < stepsDone ? '#FFD23F' : '#6B5F7D' })),
fuse: Array.from({ length: 20 }, (_, i) => ({ bg: i < lit ? '#FFD23F' : '#3A3358' })),
score: m === 'hit' ? '0060' : '0040',
promptColor: m === 'miss' ? '#E0284A' : m === 'hit' ? '#1E9C8A' : '#2A2440',
feedBg: m === 'miss' ? '#FF4D6D' : m === 'hit' ? '#3DD6C0' : '#EFE6F2',
typed: m === 'miss' ? '소퐁' : m === 'hit' ? '소풍' : ''
};
}
}
</script>
</body>
</html>
