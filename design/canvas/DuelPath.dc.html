<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duel screen, stage path</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 28px 64px 36px; display: flex; flex-direction: column; gap: 18px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <button style="padding: 6px 12px; font-family: 'Pixelify Sans', sans-serif; font-size: 16px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&lt; MENU</button>
    <span style="font-size: 18px; font-weight: 700; letter-spacing: 2px;">WORD STRIKE</span>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 7px; padding: 4px 10px; font-family: 'Jua', sans-serif; font-size: 15px; color: #3DD6C0; border: 3px solid #3DD6C0;">English <svg width="10" height="10" viewBox="0 0 5 5" shape-rendering="crispEdges" role="img" aria-label="to"><path fill="currentColor" d="M0 2h4v1h-4zM2 0h1v1h-1zM3 1h1v1h-1zM4 2h1v1h-1zM3 3h1v1h-1zM2 4h1v1h-1z"></path></svg> <span lang="ko">한국어</span></span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 8px 8px 0 #000; color: #2A2440;">

    <div role="meter" aria-label="Fuse" aria-valuemin="0" aria-valuemax="24" aria-valuenow="{{lit}}" style="display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 3px; height: 20px; padding: 4px; box-sizing: border-box; background: #2A2440;">
      <sc-for list="{{fuse}}" as="f" hint-placeholder-count="24">
        <span style="background: {{f.bg}};"></span>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px; padding: 16px 24px; border-bottom: 4px solid #EFE6F2;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #1E9C8A;">YOU</span>
        <span role="img" aria-label="You: {{heartsLeft}} of 3 hearts" style="display: flex; gap: 4px;">
          <sc-for list="{{hearts}}" as="h" hint-placeholder-count="3">
            <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{h.fill}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="{{h.hl}}"></rect></svg>
          </sc-for>
        </span>
      </div>

      <div role="img" aria-label="Stage 2, {{stepsDone}} of 3 steps to stage 3" style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
        <div style="display: flex; align-items: center; gap: 5px;">
          <span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; font-size: 16px; font-weight: 700; color: #2A2440; background: #3DD6C0; border: 3px solid #2A2440; box-sizing: border-box;">1</span>
          <span style="width: 12px; height: 12px; background: #3DD6C0;"></span><span style="width: 12px; height: 12px; background: #3DD6C0;"></span><span style="width: 12px; height: 12px; background: #3DD6C0;"></span>
          <span style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; font-size: 20px; font-weight: 700; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 3px 3px 0 #2A2440; box-sizing: border-box;">2</span>
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
            <span style="width: 12px; height: 12px; box-sizing: border-box; background: {{s.bg}}; border: 3px solid {{s.border}};"></span>
          </sc-for>
          <span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; font-size: 16px; font-weight: 700; color: #6B5F7D; border: 3px solid #A597B2; box-sizing: border-box;">3</span>
          <span style="width: 12px; height: 12px; box-sizing: border-box; border: 3px solid #D6C9DD;"></span><span style="width: 12px; height: 12px; box-sizing: border-box; border: 3px solid #D6C9DD;"></span><span style="width: 12px; height: 12px; box-sizing: border-box; border: 3px solid #D6C9DD;"></span>
          <span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; font-size: 16px; font-weight: 700; color: #6B5F7D; border: 3px dashed #D6C9DD; box-sizing: border-box;">4</span>
        </div>
        <span style="font-size: 12px; letter-spacing: 1px; color: #6B5F7D;">STAGE 2 · 9 SECOND FUSE</span>
      </div>

      <div style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1;">
        <span style="font-size: 12px; color: #6B5F7D; margin-bottom: 4px;">BEST 1210</span>
        <span style="font-size: 32px; font-weight: 700; color: #2A2440;">{{score}}</span>
      </div>
    </div>

    <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
      <span style="font-size: 13px; letter-spacing: 2px; color: #6B5F7D;">TYPE IT IN KOREAN</span>
      <span style="font-family: 'Jua', sans-serif; font-size: 96px; line-height: 1.2; color: {{promptColor}};">picnic</span>
      <div role="status" style="min-height: 64px; display: flex; align-items: center;">
        <sc-if value="{{isMiss}}" hint-placeholder-val="{{ true }}">
          <span style="display: flex; align-items: center; gap: 14px; padding: 8px 16px; color: #2A2440; background: #FF4D6D; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440;">
            <span style="font-size: 17px; letter-spacing: 1px;">NOT QUITE</span>
            <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 34px; line-height: 1; color: #FBF7FC;">소풍</span>
          </span>
        </sc-if>
        <sc-if value="{{isHit}}" hint-placeholder-val="{{ false }}">
          <span style="display: flex; align-items: center; gap: 14px; padding: 8px 16px; color: #2A2440; background: #3DD6C0; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440;">
            <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 30px; line-height: 1;">잘했어요!</span>
            <span style="font-size: 17px; letter-spacing: 1px;">+20</span>
          </span>
        </sc-if>
      </div>
    </div>

    <div style="display: flex; gap: 12px; padding: 16px 24px 20px; background: #EFE6F2; border-top: 4px solid #2A2440;">
      <label for="path-answer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Your answer</label>
      <input id="path-answer" readonly value="{{typed}}" placeholder="Type in Korean" lang="ko" style="flex-grow: 1; min-width: 0; padding: 12px 18px; font-family: 'Jua', sans-serif; font-size: 28px; color: #2A2440; background: #FFFFFF; border: 4px solid #2A2440; outline: none;">
      <button style="padding: 0 36px; font-family: 'Pixelify Sans', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440; cursor: pointer;">HIT</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"moment":{"editor":"enum","options":["miss","playing","hit"],"default":"miss"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const m = this.props.moment || 'miss';
const heartsLeft = m === 'miss' ? 1 : 2;
const stepsDone = m === 'hit' ? 2 : 1;
const lit = m === 'playing' ? 14 : m === 'hit' ? 10 : 0;
return {
isMiss: m === 'miss', isHit: m === 'hit',
heartsLeft: heartsLeft, stepsDone: stepsDone, lit: lit,
hearts: [0, 1, 2].map((i) => ({ fill: i < heartsLeft ? '#3DD6C0' : '#D6C9DD', hl: i < heartsLeft ? '#FFFFFF' : '#D6C9DD' })),
steps: [0, 1, 2].map((i) => ({ bg: i < stepsDone ? '#FFD23F' : 'transparent', border: i < stepsDone ? '#2A2440' : '#A597B2' })),
fuse: Array.from({ length: 24 }, (_, i) => ({ bg: Math.abs(i - 11.5) < lit / 2 ? '#FFD23F' : 'transparent' })),
score: m === 'hit' ? '0060' : '0040',
promptColor: m === 'miss' ? '#E0284A' : m === 'hit' ? '#1E9C8A' : '#2A2440',
typed: m === 'miss' ? '소퐁' : m === 'hit' ? '소풍' : ''
};
}
}
</script>
</body>
</html>
