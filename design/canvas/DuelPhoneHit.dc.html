<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duel screen on a phone, Right answer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#8A7FA6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 10px 16px; display: flex; flex-direction: column; gap: 10px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <button style="min-height: 44px; padding: 4px 10px; font-family: 'Pixelify Sans', sans-serif; font-size: 14px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&lt; MENU</button>
    <span style="font-size: 15px; font-weight: 700; letter-spacing: 2px;">WORD STRIKE</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 6px 6px 0 #000; color: #2A2440;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 10px 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #1E9C8A;">YOU</span>
        <span role="img" aria-label="You: {{heartsLeft}} of 3 hearts" style="display: flex; gap: 4px;">
          <sc-for list="{{hearts}}" as="h" hint-placeholder-count="3">
            <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{h.fill}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="{{h.hl}}"></rect></svg>
          </sc-for>
        </span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1;">
        <span style="font-size: 12px; color: #6B5F7D; margin-bottom: 4px;">BEST 1210</span>
        <span style="display: flex; align-items: center; gap: 10px;">
          <sc-if value="{{hasPoints}}" hint-placeholder-val="{{ false }}">
            <span style="padding: 2px 6px; font-size: 16px; font-weight: 700; color: #2A2440; background: #3DD6C0;">{{points}}</span>
          </sc-if>
          <span style="font-size: 26px; font-weight: 700;">{{score}}</span>
        </span>
      </div>
    </div>

    <div role="img" aria-label="{{stepsDone}} of 3 right answers to the next stage" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; height: 6px;">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <span style="background: {{s.bg}};"></span>
      </sc-for>
    </div>

    <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;">
      <span style="font-family: 'Jua', sans-serif; font-size: 64px; line-height: 1.1; color: {{promptColor}};">picnic</span>
      <div role="meter" aria-label="Fuse" aria-valuemin="0" aria-valuemax="20" aria-valuenow="{{lit}}" style="display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; width: 240px; height: 10px;">
        <sc-for list="{{fuse}}" as="f" hint-placeholder-count="20">
          <span style="background: {{f.bg}};"></span>
        </sc-for>
      </div>

      <sc-if value="{{hasBand}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 4px 10px; min-height: 56px; padding: 8px 12px; box-sizing: border-box; font-size: 18px; letter-spacing: 1px; color: #2A2440; background: {{feedBg}}; border-top: 4px solid #2A2440;">
          <span style="font-size: 16px; font-weight: 700; letter-spacing: 2px;">{{bandLabel}}</span>
          <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 26px; line-height: 1;">{{bandWord}}</span>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; gap: 10px; padding: 12px; background: #EFE6F2; border-top: 4px solid #2A2440;">
      <label for="DuelPhoneHit-answer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Your answer</label>
      <input id="DuelPhoneHit-answer" readonly value="{{typed}}" placeholder="Type it in Korean" lang="ko" style="flex-grow: 1; min-width: 0; padding: 10px 12px; font-family: 'Jua', sans-serif; font-size: 22px; color: #2A2440; background: #FFFFFF; border: 4px solid #2A2440; outline: none; opacity: {{inputOpacity}};">
      <button style="min-width: 76px; padding: 0 16px; font-family: 'Pixelify Sans', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440; cursor: pointer; opacity: {{inputOpacity}};">{{buttonLabel}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"moment":{"editor":"enum","options":["playing","hit","miss","stage"],"default":"hit"},"button":{"editor":"enum","options":["GO","STRIKE","ENTER","SEND"],"default":"GO"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const m = this.props.moment || 'hit';
const heartsLeft = m === 'miss' ? 1 : 2;
const stepsDone = m === 'hit' ? 2 : m === 'stage' ? 3 : 1;
const lit = m === 'playing' ? 13 : m === 'hit' ? 9 : m === 'stage' ? 20 : 0;
return {
hasBand: m !== 'playing',
bandLabel: m === 'miss' ? 'THE ANSWER WAS' : m === 'stage' ? 'NEXT STAGE' : 'CORRECT',
bandWord: m === 'miss' ? '소풍' : m === 'stage' ? '잘했어요!' : '맞아요!',
hasPoints: m === 'hit' || m === 'stage',
points: m === 'stage' ? '+70' : '+20',
heartsLeft: heartsLeft, stepsDone: stepsDone, lit: lit,
buttonLabel: this.props.button || 'GO',
hearts: [0, 1, 2].map((i) => ({ fill: i < heartsLeft ? '#3DD6C0' : '#D6C9DD', hl: i < heartsLeft ? '#FFFFFF' : '#D6C9DD' })),
steps: [0, 1, 2].map((i) => ({ bg: i < stepsDone ? '#FFD23F' : '#EFE6F2' })),
fuse: Array.from({ length: 20 }, (_, i) => ({ bg: Math.abs(i - 9.5) < lit / 2 ? '#FFD23F' : '#EFE6F2' })),
score: m === 'hit' ? '0060' : m === 'stage' ? '0110' : '0040',
promptColor: m === 'miss' ? '#E0284A' : (m === 'hit' || m === 'stage') ? '#1E9C8A' : '#2A2440',
feedBg: m === 'miss' ? '#FF4D6D' : m === 'hit' ? '#3DD6C0' : '#FFD23F',
typed: m === 'miss' ? '소퐁' : m === 'hit' ? '소풍' : '',
inputOpacity: m === 'stage' ? '0.6' : '1'
};
}
}
</script>
</body>
</html>
