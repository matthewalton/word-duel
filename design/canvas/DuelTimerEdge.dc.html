<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duel screen, Timer 4 · Strip above the feedback · progress in the separator</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#8A7FA6}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 28px 64px 36px; display: flex; flex-direction: column; gap: 18px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <button style="padding: 6px 12px; font-family: 'Pixelify Sans', sans-serif; font-size: 16px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&lt; MENU</button>
    <span style="font-size: 18px; font-weight: 700; letter-spacing: 2px;">WORD STRIKE</span>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 7px; padding: 4px 10px; font-family: 'Jua', sans-serif; font-size: 15px; color: #3DD6C0; border: 3px solid #3DD6C0;">English <svg width="10" height="10" viewBox="0 0 5 5" shape-rendering="crispEdges" role="img" aria-label="to"><path fill="currentColor" d="M0 2h4v1h-4zM2 0h1v1h-1zM3 1h1v1h-1zM4 2h1v1h-1zM3 3h1v1h-1zM2 4h1v1h-1z"></path></svg> <span lang="ko">한국어</span></span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 8px 8px 0 #000; color: #2A2440;">

    <sc-if value="{{pEdge}}" hint-placeholder-val="{{ false }}">
      <div role="img" aria-label="{{stepsDone}} of 3 right answers to the next stage" style="width: 22px; flex-shrink: 0; box-sizing: border-box; display: flex; flex-direction: column-reverse; gap: 4px; padding: 4px; background: #2A2440;">
        <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
          <span style="flex-grow: 1; background: {{s.bg}};"></span>
        </sc-for>
      </div>
    </sc-if>

    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column;">

      <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px; padding: 16px 24px 14px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #1E9C8A;">YOU</span>
          <span role="img" aria-label="You: {{heartsLeft}} of 3 hearts" style="display: flex; gap: 4px;">
            <sc-for list="{{hearts}}" as="h" hint-placeholder-count="3">
              <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{h.fill}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="{{h.hl}}"></rect></svg>
            </sc-for>
          </span>
        </div>

        <div>
          <sc-if value="{{tHeader}}" hint-placeholder-val="{{ false }}">
            <div role="meter" aria-label="Fuse" aria-valuemin="0" aria-valuemax="10" aria-valuenow="{{lit10}}" style="display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #2A2440;">
              <span style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; width: 180px; height: 16px;">
                <sc-for list="{{fuse10}}" as="f" hint-placeholder-count="10">
                  <span style="background: {{f.bg}};"></span>
                </sc-for>
              </span>
              <span style="min-width: 22px; font-size: 20px; font-weight: 700; color: #FFD23F; text-align: right;">{{secs}}</span>
            </div>
          </sc-if>
        </div>

        <div style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1;">
          <span style="font-size: 12px; color: #6B5F7D; margin-bottom: 4px;">BEST 1210</span>
          <span style="font-size: 32px; font-weight: 700;">{{score}}</span>
          <sc-if value="{{pPips}}" hint-placeholder-val="{{ false }}">
            <span role="img" aria-label="{{stepsDone}} of 3 right answers to the next stage" style="display: flex; align-items: center; gap: 4px; margin-top: 8px;">
              <span style="font-size: 11px; letter-spacing: 1px; color: #6B5F7D; margin-right: 2px;">NEXT</span>
              <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
                <span style="width: 18px; height: 10px; box-sizing: border-box; background: {{s.bg}}; border: 3px solid {{s.border}};"></span>
              </sc-for>
            </span>
          </sc-if>
        </div>
      </div>

      <sc-if value="{{pSep}}" hint-placeholder-val="{{ true }}">
        <div role="img" aria-label="{{stepsDone}} of 3 right answers to the next stage" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; height: 6px;">
          <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
            <span style="background: {{s.sep}};"></span>
          </sc-for>
        </div>
      </sc-if>
      <sc-if value="{{noSep}}" hint-placeholder-val="{{ false }}">
        <div style="height: 4px; background: #EFE6F2;"></div>
      </sc-if>

      <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;">
        <sc-if value="{{tDrain}}" hint-placeholder-val="{{ false }}">
          <div role="meter" aria-label="Fuse" aria-valuemin="0" aria-valuemax="20" aria-valuenow="{{lit}}" style="position: absolute; top: 0; bottom: 0; left: 0; width: {{drainW}}; background: #FFF1B8; border-right: 6px solid {{drainEdge}};"></div>
        </sc-if>
        <span style="position: relative; font-family: 'Jua', sans-serif; font-size: 104px; line-height: 1.1; color: {{promptColor}};">picnic</span>
        <sc-if value="{{tWord}}" hint-placeholder-val="{{ false }}">
          <div role="meter" aria-label="Fuse" aria-valuemin="0" aria-valuemax="20" aria-valuenow="{{lit}}" style="display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; width: 440px; height: 12px;">
            <sc-for list="{{fuseMid}}" as="f" hint-placeholder-count="20">
              <span style="background: {{f.bg}};"></span>
            </sc-for>
          </div>
        </sc-if>
      </div>

      <sc-if value="{{tEdge}}" hint-placeholder-val="{{ false }}">
        <div role="meter" aria-label="Fuse" aria-valuemin="0" aria-valuemax="20" aria-valuenow="{{lit}}" style="display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; height: 16px; padding: 4px; box-sizing: border-box; background: #2A2440;">
          <sc-for list="{{fuse}}" as="f" hint-placeholder-count="20">
            <span style="background: {{f.bg}};"></span>
          </sc-for>
        </div>
      </sc-if>

      <div role="status" style="display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 64px; padding: 8px 24px; box-sizing: border-box; font-size: 18px; letter-spacing: 1px; color: #2A2440; background: {{feedBg}}; border-top: 4px solid {{feedLine}};">
        <sc-if value="{{isPlaying}}" hint-placeholder-val="{{ true }}">
          <span style="font-size: 15px; color: #8A7FA6;">ENTER TO HIT</span>
        </sc-if>
        <sc-if value="{{isMiss}}" hint-placeholder-val="{{ false }}">
          <span>NOT QUITE. THE ANSWER WAS</span>
          <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 36px; line-height: 1;">소풍</span>
        </sc-if>
        <sc-if value="{{isHit}}" hint-placeholder-val="{{ false }}">
          <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 30px; line-height: 1;">맞아요!</span>
          <span>RIGHT · +20</span>
        </sc-if>
        <sc-if value="{{isStage}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 26px; font-weight: 700; letter-spacing: 3px;">STAGE 3</span>
          <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 30px; line-height: 1;">잘했어요!</span>
          <span>+50 · FASTER FUSE</span>
        </sc-if>
      </div>

      <div style="display: flex; gap: 12px; padding: 16px 24px 20px; background: #EFE6F2; border-top: 4px solid #2A2440;">
        <label for="DuelTimerEdge-answer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Your answer</label>
        <input id="DuelTimerEdge-answer" readonly value="{{typed}}" placeholder="Type it in Korean" lang="ko" style="flex-grow: 1; min-width: 0; padding: 12px 18px; font-family: 'Jua', sans-serif; font-size: 28px; color: #2A2440; background: #FFFFFF; border: 4px solid #2A2440; outline: none; opacity: {{inputOpacity}};">
        <button style="padding: 0 36px; font-family: 'Pixelify Sans', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440; cursor: pointer; opacity: {{inputOpacity}};">HIT</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"moment":{"editor":"enum","options":["playing","hit","miss","stage"],"default":"playing"},"timer":{"editor":"enum","options":["drain","header","word","edge"],"default":"edge"},"progress":{"editor":"enum","options":["separator","pips","edge"],"default":"separator"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const m = this.props.moment || 'playing';
const t = this.props.timer || 'edge';
const p = this.props.progress || 'separator';
const heartsLeft = m === 'miss' ? 1 : 2;
const stepsDone = m === 'hit' ? 2 : m === 'stage' ? 3 : 1;
const lit = m === 'playing' ? 13 : m === 'hit' ? 9 : m === 'stage' ? 20 : 0;
const lit10 = Math.round(lit / 2);
return {
isPlaying: m === 'playing', isMiss: m === 'miss', isHit: m === 'hit', isStage: m === 'stage',
tDrain: t === 'drain', tHeader: t === 'header', tWord: t === 'word', tEdge: t === 'edge',
pSep: p === 'separator', noSep: p !== 'separator', pPips: p === 'pips', pEdge: p === 'edge',
heartsLeft: heartsLeft, stepsDone: stepsDone, lit: lit, lit10: lit10,
secs: m === 'stage' ? '9' : String(Math.ceil(lit / 2)),
hearts: [0, 1, 2].map((i) => ({ fill: i < heartsLeft ? '#3DD6C0' : '#D6C9DD', hl: i < heartsLeft ? '#FFFFFF' : '#D6C9DD' })),
steps: [0, 1, 2].map((i) => ({
bg: i < stepsDone ? '#FFD23F' : (p === 'edge' ? '#3A3358' : 'transparent'),
border: i < stepsDone ? '#2A2440' : '#A597B2',
sep: i < stepsDone ? '#FFD23F' : '#EFE6F2'
})),
fuse: Array.from({ length: 20 }, (_, i) => ({ bg: i < lit ? '#FFD23F' : '#3A3358' })),
fuse10: Array.from({ length: 10 }, (_, i) => ({ bg: i < lit10 ? '#FFD23F' : '#3A3358' })),
fuseMid: Array.from({ length: 20 }, (_, i) => ({ bg: Math.abs(i - 9.5) < lit / 2 ? '#FFD23F' : '#EFE6F2' })),
drainW: (lit * 5) + '%',
drainEdge: lit > 0 && lit < 20 ? '#FFD23F' : 'transparent',
score: m === 'hit' ? '0060' : m === 'stage' ? '0110' : '0040',
promptColor: m === 'miss' ? '#E0284A' : (m === 'hit' || m === 'stage') ? '#1E9C8A' : '#2A2440',
feedBg: m === 'miss' ? '#FF4D6D' : m === 'hit' ? '#3DD6C0' : m === 'stage' ? '#FFD23F' : '#FBF7FC',
feedLine: m === 'playing' ? '#EFE6F2' : '#2A2440',
typed: m === 'miss' ? '소퐁' : m === 'hit' ? '소풍' : '',
inputOpacity: m === 'stage' ? '0.6' : '1'
};
}
}
</script>
</body>
</html>
