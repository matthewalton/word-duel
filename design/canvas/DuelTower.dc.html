<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Duel screen, stage tower</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 28px 64px 36px; display: flex; flex-direction: column; gap: 18px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <button style="padding: 6px 12px; font-family: 'Pixelify Sans', sans-serif; font-size: 16px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&lt; MENU</button>
    <span style="font-size: 18px; font-weight: 700; letter-spacing: 2px;">WORD STRIKE</span>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 7px; padding: 4px 10px; font-family: 'Jua', sans-serif; font-size: 15px; color: #3DD6C0; border: 3px solid #3DD6C0;">English <svg width="10" height="10" viewBox="0 0 5 5" shape-rendering="crispEdges" role="img" aria-label="to"><path fill="currentColor" d="M0 2h4v1h-4zM2 0h1v1h-1zM3 1h1v1h-1zM4 2h1v1h-1zM3 3h1v1h-1zM2 4h1v1h-1z"></path></svg> <span lang="ko">한국어</span></span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 8px 8px 0 #000;">

    <div role="img" aria-label="Stage 2, {{stepsDone}} of 3 steps climbed. Each stage shortens the fuse." style="width: 168px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 16px 14px; box-sizing: border-box; background: #2A2440;">
      <span style="font-size: 13px; letter-spacing: 2px; color: #D6C9DD; text-align: center;">CLIMB</span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px;">
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border: 3px dashed #4E4670; color: #6B5F7D;">
          <span style="font-size: 22px; font-weight: 700;">4</span><span style="font-size: 14px;">7s</span>
        </div>
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border: 3px solid #6B5F7D; color: #A597B2;">
          <span style="font-size: 22px; font-weight: 700;">3</span><span style="font-size: 14px;">8s</span>
        </div>
        <div style="flex-grow: 1.6; display: flex; flex-direction: column; justify-content: center; gap: 10px; padding: 8px 12px; background: #3A3358; border: 4px solid #FFD23F; box-shadow: 4px 4px 0 #000;">
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <span style="font-size: 26px; font-weight: 700; color: #FFD23F;">2</span><span style="font-size: 14px; color: #FBF7FC;">9s</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;">
            <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
              <span style="height: 12px; background: {{s.bg}}; border: 3px solid {{s.border}};"></span>
            </sc-for>
          </div>
        </div>
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: #3DD6C0; color: #2A2440;">
          <span style="font-size: 22px; font-weight: 700;">1</span><span style="font-size: 14px;">10s</span>
        </div>
      </div>
      <span style="font-size: 12px; letter-spacing: 1px; color: #D6C9DD; text-align: center;">FUSE PER STAGE</span>
    </div>

    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; padding: 18px 28px 24px; color: #2A2440;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #1E9C8A;">YOU</span>
          <span role="img" aria-label="You: {{heartsLeft}} of 3 hearts" style="display: flex; gap: 4px;">
            <sc-for list="{{hearts}}" as="h" hint-placeholder-count="3">
              <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{h.fill}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="{{h.hl}}"></rect></svg>
            </sc-for>
          </span>
        </div>
        <div style="display: flex; align-items: baseline; gap: 12px; line-height: 1;">
          <span style="font-size: 12px; color: #6B5F7D;">BEST 1210</span>
          <span style="padding: 4px 10px; font-size: 30px; font-weight: 700; color: #FFD23F; background: #2A2440;">{{score}}</span>
        </div>
      </div>

      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;">
        <span style="font-size: 13px; letter-spacing: 2px; color: #6B5F7D;">TYPE IT IN KOREAN</span>
        <span style="font-family: 'Jua', sans-serif; font-size: 96px; line-height: 1.1; color: {{promptColor}};">picnic</span>
        <div role="status" style="min-height: 52px; display: flex; align-items: center; gap: 12px;">
          <sc-if value="{{isMiss}}" hint-placeholder-val="{{ true }}">
            <span style="padding: 4px 8px; font-size: 14px; letter-spacing: 1px; color: #FBF7FC; background: #E0284A;">NOT QUITE</span>
            <span style="font-size: 16px; color: #6B5F7D;">IT WAS</span>
            <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 44px; line-height: 1; color: #2A2440; border-bottom: 6px solid #2A2440;">소풍</span>
          </sc-if>
          <sc-if value="{{isHit}}" hint-placeholder-val="{{ false }}">
            <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 34px; line-height: 1; color: #1E9C8A;">잘했어요!</span>
            <span style="padding: 4px 8px; font-size: 16px; color: #2A2440; background: #3DD6C0;">+20 · STEP UP</span>
          </sc-if>
        </div>
      </div>

      <div style="display: flex; gap: 12px; align-items: stretch;">
        <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; border: 4px solid #2A2440; background: #FFFFFF;">
          <label for="tow-answer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Your answer</label>
          <input id="tow-answer" readonly value="{{typed}}" placeholder="Type in Korean" lang="ko" style="padding: 12px 18px; font-family: 'Jua', sans-serif; font-size: 28px; color: #2A2440; background: transparent; border: 0; outline: none;">
          <div role="meter" aria-label="Fuse" aria-valuemin="0" aria-valuemax="20" aria-valuenow="{{lit}}" style="display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; height: 10px; padding: 3px; background: #2A2440;">
            <sc-for list="{{fuse}}" as="f" hint-placeholder-count="20">
              <span style="background: {{f.bg}};"></span>
            </sc-for>
          </div>
        </div>
        <button style="padding: 0 36px; font-family: 'Pixelify Sans', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440; cursor: pointer;">HIT</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"moment":{"editor":"enum","options":["miss","playing","hit"],"default":"miss"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const m = this.props.moment || 'miss';
const heartsLeft = m === 'miss' ? 1 : 2;
const stepsDone = m === 'hit' ? 2 : 1;
const lit = m === 'playing' ? 13 : m === 'hit' ? 9 : 0;
return {
isMiss: m === 'miss', isHit: m === 'hit',
heartsLeft: heartsLeft, stepsDone: stepsDone, lit: lit,
hearts: [0, 1, 2].map((i) => ({ fill: i < heartsLeft ? '#3DD6C0' : '#D6C9DD', hl: i < heartsLeft ? '#FFFFFF' : '#D6C9DD' })),
steps: [0, 1, 2].map((i) => ({ bg: i < stepsDone ? '#FFD23F' : 'transparent', border: i < stepsDone ? '#FFD23F' : '#6B5F7D' })),
fuse: Array.from({ length: 20 }, (_, i) => ({ bg: i < lit ? '#FFD23F' : 'transparent' })),
score: m === 'hit' ? '0060' : '0040',
promptColor: m === 'miss' ? '#E0284A' : m === 'hit' ? '#1E9C8A' : '#2A2440',
typed: m === 'miss' ? '소퐁' : m === 'hit' ? '소풍' : ''
};
}
}
</script>
</body>
</html>
