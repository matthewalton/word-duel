<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game over as a guest, with a sign-in offer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#8A7FA6}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 28px 64px 36px; display: flex; flex-direction: column; gap: 18px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <button style="padding: 6px 12px; font-family: 'Pixelify Sans', sans-serif; font-size: 16px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&lt; MENU</button>
    <span style="font-size: 18px; font-weight: 700; letter-spacing: 2px;">WORD STRIKE</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 8px 8px 0 #000; color: #2A2440;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 24px 14px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #1E9C8A;">YOU</span>
        <span role="img" aria-label="You: 0 of 3 hearts" style="display: flex; gap: 4px;">
          <sc-for list="{{hearts}}" as="h" hint-placeholder-count="3">
            <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#D6C9DD" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path></svg>
          </sc-for>
        </span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1;">
        <span style="font-size: 12px; color: #6B5F7D; margin-bottom: 4px;">BEST {{best}}</span>
        <span style="font-size: 32px; font-weight: 700;">{{score}}</span>
      </div>
    </div>

    <div role="img" aria-label="1 of 3 right answers to the next stage" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; height: 6px;">
      <span style="background: #FFD23F;"></span>
      <span style="background: #EFE6F2;"></span>
      <span style="background: #EFE6F2;"></span>
    </div>

    <div role="status" style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 56px; align-items: center; padding: 32px 56px; background: #2A2440; color: #FBF7FC;">

      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 14px;">
        <span style="font-size: 60px; font-weight: 700; letter-spacing: 3px; line-height: 1;">GAME OVER</span>
        <span style="display: flex; align-items: center; gap: 12px;">
          <span style="font-size: 24px;">SCORE {{score}}</span>
          <sc-if value="{{newBest}}" hint-placeholder-val="{{ true }}">
            <span style="padding: 2px 10px; font-size: 20px; color: #2A2440; background: #FFD23F;">NEW BEST!</span>
          </sc-if>
        </span>
        <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 26px; color: #D6C9DD;">다시 해 봐요!</span>
        <span style="margin-top: 18px; font-size: 13px; letter-spacing: 1px; color: #D6C9DD;">Press START to play again</span>
      </div>

      <section aria-labelledby="EndOverGuest-review" style="display: flex; flex-direction: column; gap: 12px;">
        <h2 id="EndOverGuest-review" style="margin: 0; font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #D6C9DD;">TO REVIEW</h2>
        <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px;">
          <sc-for list="{{misses}}" as="m" hint-placeholder-count="3">
            <li style="display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 10px 18px; box-sizing: border-box; background: #FBF7FC; color: #2A2440; box-shadow: 4px 4px 0 #000;">
              <span lang="en" style="font-family: 'Jua', sans-serif; font-size: 28px; line-height: 1;">{{m.prompt}}</span>
              <span aria-hidden="true" style="font-size: 20px; color: #6B5F7D;">→</span>
              <span lang="ko" style="padding: 4px 12px; font-family: 'Jua', sans-serif; font-size: 30px; line-height: 1.1; background: #3DD6C0;">{{m.answer}}</span>
              <span style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
                <sc-if value="{{m.timedOut}}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 14px; letter-spacing: 1px; color: #6B5F7D;">TOO SLOW</span>
                </sc-if>
                <sc-if value="{{m.hasGuess}}" hint-placeholder-val="{{ true }}">
                  <span class="sr">You answered</span>
                  <del lang="ko" style="font-family: 'Jua', sans-serif; font-size: 22px; color: #B8203F; text-decoration-thickness: 3px;">{{m.guess}}</del>
                </sc-if>
              </span>
            </li>
          </sc-for>
        </ol>
        <div style="display: flex; align-items: center; gap: 16px; margin-top: 6px; padding: 12px 16px; border: 4px dashed #6B5F7D;">
          <span style="flex-grow: 1; font-family: 'Jua', sans-serif; font-size: 17px; line-height: 1.35; color: #D6C9DD;">Sign in to keep these words and see which ones you miss most.</span>
          <button style="flex: none; padding: 6px 14px; font-family: 'Pixelify Sans', sans-serif; font-size: 16px; letter-spacing: 1px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">SIGN IN</button>
        </div>
      </section>
    </div>

    <div style="display: flex; gap: 12px; padding: 16px 24px 20px; background: #EFE6F2; border-top: 4px solid #2A2440;">
      <label for="EndOverGuest-answer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Your answer</label>
      <input id="EndOverGuest-answer" readonly disabled placeholder="Type it in Korean" lang="ko" style="flex-grow: 1; min-width: 0; padding: 12px 18px; font-family: 'Jua', sans-serif; font-size: 28px; color: #2A2440; background: #FFFFFF; border: 4px solid #2A2440; outline: none; opacity: 0.5;">
      <button style="min-width: 150px; padding: 0 28px; font-family: 'Pixelify Sans', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440; cursor: pointer;">START</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"newBest":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const newBest = this.props.newBest ?? false;
return {
newBest: newBest,
score: '0240',
best: newBest ? '0240' : '1210',
hearts: [0, 1, 2],
misses: [
{ prompt: 'cat', answer: '고양이', timedOut: true, hasGuess: false, guess: '' },
{ prompt: 'love', answer: '사랑', timedOut: false, hasGuess: true, guess: '사람' },
{ prompt: 'picnic', answer: '소풍', timedOut: false, hasGuess: true, guess: '소퐁' }
]
};
}
}
</script>
</body>
</html>
