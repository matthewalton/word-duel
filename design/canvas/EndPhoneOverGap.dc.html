<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game over with review on a phone, Gap Guard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 10px 16px; display: flex; flex-direction: column; gap: 10px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <button style="min-height: 44px; padding: 4px 10px; font-family: 'Pixelify Sans', sans-serif; font-size: 14px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&lt; MENU</button>
    <span style="font-size: 15px; font-weight: 700; letter-spacing: 2px;">GAP GUARD</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 6px 6px 0 #000; color: #2A2440;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 10px 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #1E9C8A;">YOU</span>
        <span role="img" aria-label="You: 0 of 3 hearts" style="display: flex; gap: 4px;">
          <sc-for list="{{hearts}}" as="h" hint-placeholder-count="3">
            <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#D6C9DD" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path></svg>
          </sc-for>
        </span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1;">
        <span style="font-size: 12px; color: #6B5F7D; margin-bottom: 4px;">BEST 0980</span>
        <span style="font-size: 26px; font-weight: 700;">0410</span>
      </div>
    </div>

    <div role="img" aria-label="2 of 3 right answers to the next stage" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; height: 6px;">
      <span style="background: #FFD23F;"></span>
      <span style="background: #FFD23F;"></span>
      <span style="background: #EFE6F2;"></span>
    </div>

    <div role="status" style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 20px; padding: 16px 14px; background: #2A2440; color: #FBF7FC;">

      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;">
        <span style="font-size: 40px; font-weight: 700; letter-spacing: 3px; line-height: 1;">GAME OVER</span>
        <span style="font-size: 20px;">SCORE 0410</span>
        <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 22px; color: #D6C9DD;">다시 해 봐요!</span>
      </div>

      <section aria-labelledby="EndPhoneOverGap-review" style="display: flex; flex-direction: column; gap: 10px;">
        <h2 id="EndPhoneOverGap-review" style="margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #D6C9DD;">TO REVIEW</h2>
        <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px;">
          <sc-for list="{{misses}}" as="m" hint-placeholder-count="3">
            <li style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; background: #FBF7FC; color: #2A2440; box-shadow: 4px 4px 0 #000;">
              <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0;">
                <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 22px; line-height: 1.3;">{{m.before}}<span style="padding: 0 4px; background: #3DD6C0;">{{m.answer}}</span>{{m.after}}</span>
                <span lang="en" style="font-family: 'Jua', sans-serif; font-size: 15px; color: #6B5F7D;">{{m.translation}}</span>
              </span>
              <span style="margin-left: auto; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding-top: 4px;">
                <sc-if value="{{m.timedOut}}" hint-placeholder-val="{{ false }}">
                  <span style="font-size: 12px; letter-spacing: 1px; color: #6B5F7D;">TOO SLOW</span>
                </sc-if>
                <sc-if value="{{m.hasGuess}}" hint-placeholder-val="{{ true }}">
                  <span class="sr">You picked</span>
                  <del lang="ko" style="font-family: 'Jua', sans-serif; font-size: 18px; color: #B8203F; text-decoration-thickness: 2px;">{{m.guess}}</del>
                </sc-if>
              </span>
            </li>
          </sc-for>
        </ol>
      </section>
    </div>

    <div style="display: flex; padding: 12px; background: #EFE6F2; border-top: 4px solid #2A2440;">
      <button style="flex-grow: 1; min-height: 56px; font-family: 'Pixelify Sans', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440; cursor: pointer;">START</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
hearts: [0, 1, 2],
misses: [
{ before: '저는 사과', answer: '를', after: ' 먹어요.', translation: 'I eat an apple.', timedOut: false, hasGuess: true, guess: '을' },
{ before: '도서관', answer: '에서', after: ' 책을 읽어요.', translation: 'I read a book at the library.', timedOut: true, hasGuess: false, guess: '' },
{ before: '저는 학교', answer: '에', after: ' 가요.', translation: 'I go to school.', timedOut: false, hasGuess: true, guess: '에서' }
]
};
}
}
</script>
</body>
</html>
