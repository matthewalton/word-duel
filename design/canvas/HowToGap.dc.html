<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How-to card, Gap Guard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
a{color:#3DD6C0}a:hover{color:#FFD23F}
</style>
</helmet>
<div style="width: 760px; height: 640px; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 14px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; border: 4px solid #2A2440; font-family: 'Pixelify Sans', 'Gowun Dodum', sans-serif; color: #FBF7FC;">
  <div style="display: flex; gap: 8px; align-items: center;">
    <button style="padding: 6px 12px; font: inherit; font-size: 16px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD;">Word Strike</button>
    <button style="padding: 6px 12px; font: inherit; font-size: 16px; color: #2A2440; background: #FFD23F; border: 4px solid #FFD23F;">Gap Guard</button>
  </div>
  <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 18px; font-weight: 700; color: #3DD6C0;">YOU</span>
      <span style="display: flex; gap: 4px;">
        <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3DD6C0" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
        <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3DD6C0" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
        <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3DD6C0" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
      </span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; line-height: 1;">
      <span style="font-size: 12px; color: #D6C9DD; margin-bottom: 4px;">BEST 0000</span>
      <span style="font-size: 32px; font-weight: 700; color: #FFD23F;">0000</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; justify-content: flex-end;">
      <span style="display: flex; gap: 4px;">
        <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FF4D6D" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
        <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FF4D6D" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
        <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FF4D6D" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
      </span>
      <span style="font-size: 18px; font-weight: 700; color: #FF4D6D;">CPU 1</span>
    </div>
  </div>
  <div style="flex-grow: 1; padding: 22px 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #FBF7FC; color: #2A2440; border: 4px solid #2A2440; box-shadow: 6px 6px 0 rgba(0,0,0,0.35);">
    <span style="font-size: 13px; letter-spacing: 2px; color: #6B5F7D;">HOW TO PLAY</span>
    <h1 style="margin: 0; font-size: 44px; font-weight: 700; letter-spacing: 3px;">GAP GUARD</h1>
    <p style="margin: 0; max-width: 460px; text-align: center; font-family: 'Gowun Dodum', sans-serif; font-size: 18px; line-height: 1.45; color: #4A4060;">A Korean sentence is missing one piece. Pick it from three choices, or press 1, 2 or 3. Each right answer breaks a CPU heart.</p>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 22px; background: #EFE6F2; border: 4px solid #D6C9DD;">
      <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 34px;">저는 학교<span style="color: #1E9C8A; border-bottom: 5px solid #1E9C8A;">에</span> 가요.</span>
      <span style="font-family: 'Gowun Dodum', sans-serif; font-size: 15px; color: #6B5F7D;">I go to school.</span>
    </div>
    <div style="display: flex; gap: 18px; font-size: 13px; letter-spacing: 1px; color: #6B5F7D;">
      <span>10 SENTENCES</span><span>PARTICLES &amp; ENDINGS</span><span>10s FUSE</span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <button style="width: 100%; padding: 12px; font-family: 'Pixelify Sans', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 3px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #000;">START</button>
    <span style="font-size: 14px; color: #D6C9DD;">or press Enter</span>
  </div>
</div>
</x-dc>

</body>
</html>
