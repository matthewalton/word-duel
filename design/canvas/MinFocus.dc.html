<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Minimal single-focus start screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
a{color:#D6C9DD}a:hover{color:#FFD23F}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 40px 64px; display: flex; flex-direction: column; align-items: center; gap: 28px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', 'Gowun Dodum', sans-serif; color: #FBF7FC;">
  <div style="display: flex; align-items: center; gap: 18px;">
    <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3DD6C0" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
    <span style="font-size: 30px; font-weight: 700; letter-spacing: 5px;">WORD DUEL</span>
    <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FF4D6D" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
  </div>
  <div style="flex-grow: 1; align-self: stretch; display: flex; align-items: center; gap: 36px;">
    <button aria-label="Previous minigame" style="width: 64px; height: 64px; font: inherit; font-size: 28px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&lt;</button>
    <div style="flex-grow: 1; align-self: stretch; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; padding: 32px; color: #2A2440; background: #FBF7FC; border: 4px solid #FFD23F; box-shadow: 10px 10px 0 #FFD23F;">
      <span style="font-family: 'Jua', sans-serif; font-size: 120px; line-height: 1;">water</span>
      <span style="display: flex; align-items: center; width: 56%; padding: 10px 16px; background: #EFE6F2; border: 4px solid #3DD6C0;">
        <span lang="ko" style="font-family: 'Gowun Dodum', sans-serif; font-size: 44px;">물</span>
        <span style="width: 4px; height: 44px; margin-left: 4px; background: #2A2440;"></span>
      </span>
      <span style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; width: 56%; height: 14px; padding: 3px; background: #2A2440;">
        <span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span></span><span></span><span></span><span></span><span></span>
      </span>
    </div>
    <button aria-label="Next minigame" style="width: 64px; height: 64px; font: inherit; font-size: 28px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&gt;</button>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="font-size: 40px; font-weight: 700; letter-spacing: 4px;">WORD STRIKE</span>
      <span style="display: flex; gap: 6px;"><span style="width: 12px; height: 12px; background: #FFD23F;"></span><span style="width: 12px; height: 12px; background: #6B5F7D;"></span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <span style="display: flex; border: 3px solid #3DD6C0;">
        <button style="padding: 6px 12px; font: inherit; font-size: 16px; color: #2A2440; background: #3DD6C0; border: 0;">EN &gt; <span lang="ko">한</span></button>
        <button style="padding: 6px 12px; font: inherit; font-size: 16px; color: #3DD6C0; background: transparent; border: 0;"><span lang="ko">한</span> &gt; EN</button>
      </span>
      <button style="min-width: 220px; padding: 12px 28px; font-family: 'Pixelify Sans', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 3px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #000; cursor: pointer;">PLAY</button>
      <a href="#how" style="font-size: 16px;">How to play</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
