<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Minimal split start screen, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
a{color:#D6C9DD}a:hover{color:#FFD23F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 18px 24px; display: flex; flex-direction: column; gap: 18px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', 'Gowun Dodum', sans-serif; color: #FBF7FC;">
  <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
    <svg width="21" height="18" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3DD6C0" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
    <span style="font-size: 24px; font-weight: 700; letter-spacing: 4px;">WORD DUEL</span>
    <svg width="21" height="18" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FF4D6D" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
  </div>
  <button aria-label="Start Word Strike" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; font: inherit; color: #2A2440; background: #FBF7FC; border: 4px solid #FFD23F; box-shadow: 6px 6px 0 #FFD23F;">
    <span style="font-family: 'Jua', sans-serif; font-size: 56px; line-height: 1;">water</span>
    <span style="display: flex; align-items: center; width: 70%; padding: 6px 12px; background: #EFE6F2; border: 4px solid #3DD6C0;">
      <span lang="ko" style="font-family: 'Gowun Dodum', sans-serif; font-size: 26px;">물</span>
      <span style="width: 3px; height: 26px; margin-left: 3px; background: #2A2440;"></span>
    </span>
  </button>
  <div style="display: flex; align-items: center; gap: 10px;">
    <span style="font-size: 20px; font-weight: 700; letter-spacing: 2px;">WORD STRIKE</span>
    <span style="display: flex; margin-left: auto; border: 3px solid #3DD6C0;">
      <button style="padding: 3px 7px; font: inherit; font-size: 13px; color: #2A2440; background: #3DD6C0; border: 0;">EN &gt; <span lang="ko">한</span></button>
      <button style="padding: 3px 7px; font: inherit; font-size: 13px; color: #3DD6C0; background: transparent; border: 0;"><span lang="ko">한</span> &gt; EN</button>
    </span>
    <button aria-label="How Word Strike works" style="width: 32px; height: 32px; font: inherit; font-size: 18px; font-weight: 700; color: #FBF7FC; background: transparent; border: 3px solid #D6C9DD;">?</button>
  </div>
  <button aria-label="Start Gap Guard" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; font: inherit; color: #2A2440; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 6px 6px 0 rgba(0,0,0,0.4);">
    <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 42px; line-height: 1.1;">학교<span style="display: inline-block; min-width: 1.3em; color: #1E9C8A; border-bottom: 5px solid #1E9C8A;">에</span> 가요.</span>
    <span style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; width: 90%;">
      <span lang="ko" style="padding: 6px 0; text-align: center; font-family: 'Gowun Dodum', sans-serif; font-size: 20px; background: #3DD6C0; border: 3px solid #2A2440;">에</span>
      <span lang="ko" style="padding: 6px 0; text-align: center; font-family: 'Gowun Dodum', sans-serif; font-size: 20px; background: #FBF7FC; border: 3px solid #2A2440;">에서</span>
      <span lang="ko" style="padding: 6px 0; text-align: center; font-family: 'Gowun Dodum', sans-serif; font-size: 20px; background: #FBF7FC; border: 3px solid #2A2440;">를</span>
    </span>
  </button>
  <div style="display: flex; align-items: center; gap: 10px;">
    <span style="font-size: 20px; font-weight: 700; letter-spacing: 2px;">GAP GUARD</span>
    <button aria-label="How Gap Guard works" style="margin-left: auto; width: 32px; height: 32px; font: inherit; font-size: 18px; font-weight: 700; color: #FBF7FC; background: transparent; border: 3px solid #D6C9DD;">?</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
