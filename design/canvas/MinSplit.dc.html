<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Minimal split start screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;family=Gowun+Dodum&amp;display=swap">
<style>
body{margin:0}
a{color:#D6C9DD}a:hover{color:#FFD23F}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 40px 64px; display: flex; flex-direction: column; align-items: center; gap: 36px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', 'Gowun Dodum', sans-serif; color: #FBF7FC;">
  <div style="display: flex; align-items: center; gap: 18px;">
    <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3DD6C0" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
    <span style="font-size: 30px; font-weight: 700; letter-spacing: 5px;">WORD DUEL</span>
    <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FF4D6D" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
  </div>
  <div style="flex-grow: 1; align-self: stretch; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px;">
    <div style="display: flex; flex-direction: column; gap: 18px;">
      <button aria-label="Start Word Strike" style="position: relative; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 32px; font: inherit; color: #2A2440; background: #FBF7FC; border: 4px solid #FFD23F; box-shadow: 10px 10px 0 #FFD23F; cursor: pointer;">
        <span style="position: absolute; top: 14px; right: 18px; font-size: 22px; font-weight: 700; color: #1E9C8A;">+10</span>
        <span style="font-family: 'Jua', sans-serif; font-size: 96px; line-height: 1;">water</span>
        <span style="display: flex; align-items: center; gap: 0; width: 70%; padding: 10px 16px; background: #EFE6F2; border: 4px solid #3DD6C0;">
          <span lang="ko" style="font-family: 'Gowun Dodum', sans-serif; font-size: 40px;">물</span>
          <span style="width: 4px; height: 40px; margin-left: 4px; background: #2A2440;"></span>
        </span>
        <span style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; width: 70%; height: 14px; padding: 3px; background: #2A2440;">
          <span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span style="background: #FFD23F;"></span><span></span><span></span><span></span><span></span><span></span>
        </span>
      </button>
      <div style="display: flex; align-items: center; gap: 14px;">
        <span style="font-size: 13px; color: #2A2440; background: #FFD23F; padding: 2px 7px;">1</span>
        <span style="font-size: 28px; font-weight: 700; letter-spacing: 3px;">WORD STRIKE</span>
        <span style="display: flex; margin-left: auto; border: 3px solid #3DD6C0;">
          <button style="padding: 4px 10px; font: inherit; font-size: 15px; color: #2A2440; background: #3DD6C0; border: 0;">EN &gt; <span lang="ko">한</span></button>
          <button style="padding: 4px 10px; font: inherit; font-size: 15px; color: #3DD6C0; background: transparent; border: 0;"><span lang="ko">한</span> &gt; EN</button>
        </span>
        <button aria-label="How Word Strike works" style="width: 36px; height: 36px; font: inherit; font-size: 20px; font-weight: 700; color: #FBF7FC; background: transparent; border: 3px solid #D6C9DD; cursor: pointer;">?</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 18px;">
      <button aria-label="Start Gap Guard" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; padding: 32px; font: inherit; color: #2A2440; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 10px 10px 0 rgba(0,0,0,0.4); cursor: pointer;">
        <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 72px; line-height: 1.1;">학교<span style="display: inline-block; min-width: 1.3em; margin: 0 0.06em; color: #1E9C8A; border-bottom: 7px solid #1E9C8A;">에</span> 가요.</span>
        <span style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 78%;">
          <span lang="ko" style="padding: 10px 0; text-align: center; font-family: 'Gowun Dodum', sans-serif; font-size: 30px; background: #3DD6C0; border: 4px solid #2A2440;">에</span>
          <span lang="ko" style="padding: 10px 0; text-align: center; font-family: 'Gowun Dodum', sans-serif; font-size: 30px; background: #FBF7FC; border: 4px solid #2A2440;">에서</span>
          <span lang="ko" style="padding: 10px 0; text-align: center; font-family: 'Gowun Dodum', sans-serif; font-size: 30px; background: #FBF7FC; border: 4px solid #2A2440;">를</span>
        </span>
      </button>
      <div style="display: flex; align-items: center; gap: 14px;">
        <span style="font-size: 13px; color: #2A2440; background: #D6C9DD; padding: 2px 7px;">2</span>
        <span style="font-size: 28px; font-weight: 700; letter-spacing: 3px;">GAP GUARD</span>
        <button aria-label="How Gap Guard works" style="margin-left: auto; width: 36px; height: 36px; font: inherit; font-size: 20px; font-weight: 700; color: #FBF7FC; background: transparent; border: 3px solid #D6C9DD; cursor: pointer;">?</button>
      </div>
    </div>
  </div>
  <span style="font-size: 15px; letter-spacing: 1px; color: #D6C9DD;">Click a mode or press 1 / 2 to play · BEST 0110 / 0000</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
