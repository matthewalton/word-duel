<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage clear, bar and header only</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#8A7FA6}
@keyframes flash{0%{background:#FFD23F}50%{background:#FFFFFF}}
.flash{animation:flash 240ms steps(1) infinite}
@keyframes pop{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.pop{animation:pop 240ms steps(3) both}
@keyframes bandIn{0%{transform:translateY(100%)}100%{transform:translateY(0)}}
.bandIn{animation:bandIn 160ms steps(2) both}
@media (prefers-reduced-motion: reduce){.flash,.pop,.bandIn{animation:none}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 28px 64px 36px; display: flex; flex-direction: column; gap: 18px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <button style="padding: 6px 12px; font-family: 'Pixelify Sans', sans-serif; font-size: 16px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&lt; MENU</button>
    <span style="font-size: 18px; font-weight: 700; letter-spacing: 2px;">WORD STRIKE</span>
    <span style="margin-left: auto; font-size: 14px; letter-spacing: 1px; color: #D6C9DD;">{{caption}}</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 8px 8px 0 #000; color: #2A2440;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 24px 14px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #1E9C8A;">YOU</span>
        <span role="img" aria-label="You: 2 of 3 hearts" style="display: flex; gap: 4px;">
          <sc-for list="{{hearts}}" as="h" hint-placeholder-count="3">
            <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{h.fill}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="{{h.hl}}"></rect></svg>
          </sc-for>
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 20px;">
        <sc-if value="{{tagStage1}}" hint-placeholder-val="{{ false }}">
          <span style="padding: 4px 10px; font-size: 18px; font-weight: 700; letter-spacing: 2px; border: 4px solid #2A2440;">STAGE 1</span>
        </sc-if>
        <sc-if value="{{tagStage2}}" hint-placeholder-val="{{ true }}">
          <span class="pop" style="padding: 4px 10px; font-size: 18px; font-weight: 700; letter-spacing: 2px; background: #FFD23F; border: 4px solid #2A2440;">STAGE 2</span>
        </sc-if>
        <div style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1;">
          <span style="font-size: 12px; color: #6B5F7D; margin-bottom: 4px;">BEST 1210</span>
          <span style="display: flex; align-items: center; gap: 10px;">
            <sc-if value="{{hasPoints}}" hint-placeholder-val="{{ false }}">
              <span style="padding: 3px 8px; font-size: 20px; font-weight: 700; color: #2A2440; background: #3DD6C0;">+70</span>
            </sc-if>
            <span style="font-size: 32px; font-weight: 700;">{{score}}</span>
          </span>
        </div>
      </div>
    </div>

    <div role="img" aria-label="{{barLabel}}" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; height: 6px;">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
        <span class="{{s.cls}}" style="background: {{s.bg}};"></span>
      </sc-for>
    </div>

    <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;">
      <span style="font-family: 'Jua', sans-serif; font-size: 104px; line-height: 1.1; color: {{promptColor}};">{{prompt}}</span>
      <div role="meter" aria-label="Time left" aria-valuemin="0" aria-valuemax="20" aria-valuenow="{{lit}}" style="display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; width: 440px; height: 12px;">
        <sc-for list="{{fuse}}" as="f" hint-placeholder-count="20">
          <span style="background: {{f.bg}};"></span>
        </sc-for>
      </div>

      <sc-if value="{{hasBand}}" hint-placeholder-val="{{ false }}">
        <div role="status" class="bandIn" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 64px; padding: 8px 24px; box-sizing: border-box; color: #2A2440; background: {{bandBg}}; border-top: 4px solid #2A2440;">
          <span style="font-size: 20px; font-weight: 700; letter-spacing: 2px;">{{bandLabel}}</span>
          <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 32px; line-height: 1;">{{bandWord}}</span>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; gap: 12px; padding: 16px 24px 20px; background: #EFE6F2; border-top: 4px solid #2A2440;">
      <label for="StageA-answer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Your answer</label>
      <input id="StageA-answer" readonly value="{{typed}}" placeholder="Type it in Korean" lang="ko" style="flex-grow: 1; min-width: 0; padding: 12px 18px; font-family: 'Jua', sans-serif; font-size: 28px; color: #2A2440; background: #FFFFFF; border: 4px solid #2A2440; outline: none;">
      <button style="min-width: 150px; padding: 0 28px; font-family: 'Pixelify Sans', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440; cursor: pointer;">GO</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"option":{"editor":"enum","options":["bar","band","nothing"],"default":"bar"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { step: 'playing' }; this.timer = null; }
componentDidMount() { this.run('playing'); }
componentWillUnmount() { clearTimeout(this.timer); }
durations() {
const o = this.props.option || 'bar';
return { playing: 1600, hit: o === 'band' ? 1300 : o === 'bar' ? 1000 : 650, next: 1800 };
}
run(step) {
this.setState({ step: step });
const nextStep = step === 'playing' ? 'hit' : step === 'hit' ? 'next' : 'playing';
this.timer = setTimeout(() => this.run(nextStep), this.durations()[step]);
}
renderVals() {
const o = this.props.option || 'bar';
const step = this.state.step || 'playing';
const hit = step === 'hit';
const next = step === 'next';
const done = step === 'playing' ? 2 : hit ? 3 : 0;
const lit = next ? 20 : 12;
const band = o === 'band';
return {
caption: step === 'playing' ? 'typing the last answer of stage 1' : hit ? 'right answer clears the stage' : 'stage 2, next prompt',
tagStage1: o === 'bar' && step === 'playing',
tagStage2: o === 'bar' && step !== 'playing',
hasPoints: hit,
score: step === 'playing' ? '0060' : '0130',
barLabel: (next ? 'Stage 2: ' : 'Stage 1: ') + done + ' of 3 right answers to the next stage',
steps: [0, 1, 2].map((i) => ({ bg: i < done ? '#FFD23F' : '#EFE6F2', cls: hit && o === 'bar' ? 'flash' : '' })),
prompt: next ? 'river' : 'picnic',
promptColor: hit ? '#1E9C8A' : '#2A2440',
lit: lit,
fuse: Array.from({ length: 20 }, (_, i) => ({ bg: Math.abs(i - 9.5) < lit / 2 ? '#FFD23F' : '#EFE6F2' })),
hasBand: hit,
bandBg: band ? '#FFD23F' : '#3DD6C0',
bandLabel: band ? 'STAGE 2' : 'CORRECT',
bandWord: band ? '잘했어요!' : '맞아요!',
typed: next ? '' : '소풍',
hearts: [0, 1, 2].map((i) => ({ fill: i < 2 ? '#3DD6C0' : '#D6C9DD', hl: i < 2 ? '#FFFFFF' : '#D6C9DD' }))
};
}
}
</script>
</body>
</html>
