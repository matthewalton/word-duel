<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stage card on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#8A7FA6}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 10px 16px; display: flex; flex-direction: column; gap: 10px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <button style="min-height: 44px; padding: 4px 10px; font-family: 'Pixelify Sans', sans-serif; font-size: 14px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&lt; MENU</button>
    <span style="font-size: 15px; font-weight: 700; letter-spacing: 2px;">WORD STRIKE</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 6px 6px 0 #000; color: #2A2440;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 10px 12px;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #1E9C8A;">YOU</span>
        <span role="img" aria-label="You: 2 of 3 hearts" style="display: flex; gap: 4px;">
          <sc-for list="{{hearts}}" as="h" hint-placeholder-count="3">
            <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{h.fill}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="{{h.hl}}"></rect></svg>
          </sc-for>
        </span>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1;">
        <span style="font-size: 12px; color: #6B5F7D; margin-bottom: 4px;">BEST 1210</span>
        <span style="font-size: 26px; font-weight: 700;">0110</span>
      </div>
    </div>

    <div role="img" aria-label="Stage 2: 0 of 3 right answers to the next stage" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; height: 6px;">
      <span style="background: #EFE6F2;"></span>
      <span style="background: #EFE6F2;"></span>
      <span style="background: #EFE6F2;"></span>
    </div>

    <div role="status" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;">
      <span style="font-size: 68px; font-weight: 700; letter-spacing: 4px; line-height: 1;">STAGE {{stage}}</span>
      <span style="display: flex; align-items: center; gap: 12px;">
        <span style="padding: 4px 12px; font-size: 20px; font-weight: 700; letter-spacing: 2px; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440;">FUSE {{fuse}}s</span>
        <span style="padding: 4px 12px; font-size: 20px; font-weight: 700; letter-spacing: 2px; background: #3DD6C0; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440;">+50</span>
      </span>
      <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 26px; color: #6B5F7D;">잘했어요!</span>
    </div>

    <div style="display: flex; gap: 10px; padding: 12px; background: #EFE6F2; border-top: 4px solid #2A2440;">
      <label for="StageCardPhone-answer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Your answer</label>
      <input id="StageCardPhone-answer" readonly disabled placeholder="Type it in Korean" lang="ko" style="flex-grow: 1; min-width: 0; padding: 10px 12px; font-family: 'Jua', sans-serif; font-size: 22px; color: #2A2440; background: #FFFFFF; border: 4px solid #2A2440; outline: none; opacity: 0.5;">
      <button disabled style="min-width: 76px; padding: 0 16px; font-family: 'Pixelify Sans', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440; opacity: 0.5;">GO</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"stage":{"editor":"number","default":2},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const stage = this.props.stage ?? 2;
return {
stage: stage,
fuse: Math.max(4, 10 - (stage - 1)),
hearts: [0, 1, 2].map((i) => ({ fill: i < 2 ? '#3DD6C0' : '#D6C9DD', hl: i < 2 ? '#FFFFFF' : '#D6C9DD' }))
};
}
}
</script>
</body>
</html>
