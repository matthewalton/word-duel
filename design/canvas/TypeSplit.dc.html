<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Title screen type and language picker</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div tabindex="0" onKeyDown="{{onKey}}" style="width: 1280px; height: 800px; box-sizing: border-box; padding: 36px 64px 32px; display: flex; flex-direction: column; align-items: center; gap: 28px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC; outline: none;">
  <div style="display: flex; align-items: center; gap: 18px;">
    <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3DD6C0" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
    <span style="font-family: {{brandFont}}; font-size: {{brandSize}}; font-weight: 700; letter-spacing: {{brandSpacing}};">WORD DUEL</span>
    <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FF4D6D" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
  </div>

  <div style="flex-grow: 1; align-self: stretch; display: flex; gap: 40px; min-height: 0;">

    <div style="flex: {{ws.grow}} 1 0; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding: 22px; color: {{ws.text}}; background: {{ws.cardBg}}; border: 4px solid {{ws.border}}; box-shadow: {{ws.shadow}}; transition: flex-grow 240ms steps(4, end);">
      <button aria-label="{{ws.action}} Word Strike" onClick="{{selectWs}}" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; font: inherit; color: {{ws.pvInk}}; background: {{ws.pvBg}}; border: 4px solid {{ws.pvFrame}}; cursor: pointer;">
        <span style="font-family: 'Jua', sans-serif; font-size: {{ws.promptSize}}; line-height: 1;">water</span>
        <span style="display: flex; align-items: center; width: 72%; padding: 8px 14px; background: {{ws.pvPanel}}; border: 4px solid {{ws.pvAccent}};">
          <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: {{ws.inputSize}};">물</span>
          <span style="width: 4px; height: {{ws.inputSize}}; margin-left: 4px; background: {{ws.pvInk}};"></span>
        </span>
        <span style="display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; width: 72%; height: 14px; padding: 3px; background: {{ws.pvTrack}};">
          <span style="background: {{ws.pvFuse}};"></span><span style="background: {{ws.pvFuse}};"></span><span style="background: {{ws.pvFuse}};"></span><span style="background: {{ws.pvFuse}};"></span><span style="background: {{ws.pvFuse}};"></span><span style="background: {{ws.pvFuse}};"></span><span style="background: {{ws.pvFuse}};"></span><span style="background: {{ws.pvFuse}};"></span><span style="background: {{ws.pvFuse}};"></span><span></span><span></span><span></span><span></span><span></span>
        </span>
      </button>
      <sc-if value="{{ws.active}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
            <span style="font-family: {{nameFont}}; font-size: {{nameSize}}; font-weight: {{nameWeight}}; letter-spacing: {{nameSpacing}}; text-transform: {{nameCase}};">Word Strike</span>
            <span style="font-size: 14px; letter-spacing: 1px; color: #6B5F7D;">BEST 0110</span>
          </div>
          <span style="font-family: {{descFont}}; font-size: {{descSize}}; line-height: 1.4; color: #4A4060;">See a word, type its translation, hit Enter before the fuse runs out.</span>
          <div style="display: flex; align-items: center; gap: 8px;">
            <sc-if value="{{segment}}" hint-placeholder-val="{{ true }}">
              <span role="group" aria-label="Translate" style="display: flex; height: 36px; box-sizing: border-box; border: 3px solid #2A2440;">
                <button aria-pressed="{{dirAOn}}" onClick="{{toTarget}}" style="display: flex; align-items: center; gap: 7px; padding: 0 10px; font-family: 'Jua', sans-serif; font-size: 15px; color: #2A2440; background: {{dirA}}; border: 0; cursor: pointer;">English <svg width="10" height="10" viewBox="0 0 5 5" shape-rendering="crispEdges" aria-label="to" role="img"><path fill="currentColor" d="M0 2h4v1h-4zM2 0h1v1h-1zM3 1h1v1h-1zM4 2h1v1h-1zM3 3h1v1h-1zM2 4h1v1h-1z"></path></svg> <span lang="ko">한국어</span></button>
                <button aria-pressed="{{dirBOn}}" onClick="{{toBase}}" style="display: flex; align-items: center; gap: 7px; padding: 0 10px; font-family: 'Jua', sans-serif; font-size: 15px; color: #2A2440; background: {{dirB}}; border: 0; border-left: 3px solid #2A2440; cursor: pointer;"><span lang="ko">한국어</span> <svg width="10" height="10" viewBox="0 0 5 5" shape-rendering="crispEdges" aria-label="to" role="img"><path fill="currentColor" d="M0 2h4v1h-4zM2 0h1v1h-1zM3 1h1v1h-1zM4 2h1v1h-1zM3 3h1v1h-1zM2 4h1v1h-1z"></path></svg> English</button>
              </span>
            </sc-if>
            <sc-if value="{{swap}}" hint-placeholder-val="{{ false }}">
              <button aria-label="Swap direction, now {{swapFrom}} to {{swapTo}}" onClick="{{flip}}" style="display: flex; align-items: center; gap: 8px; height: 36px; box-sizing: border-box; padding: 0 10px; font-family: 'Jua', sans-serif; font-size: 15px; color: #2A2440; background: transparent; border: 3px solid #2A2440; cursor: pointer;">
                <span lang="{{swapFromLang}}">{{swapFrom}}</span>
                <svg width="10" height="10" viewBox="0 0 5 5" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M0 2h4v1h-4zM2 0h1v1h-1zM3 1h1v1h-1zM4 2h1v1h-1zM3 3h1v1h-1zM2 4h1v1h-1z"></path></svg>
                <span lang="{{swapToLang}}">{{swapTo}}</span>
                <span style="display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; margin-left: 2px; background: #3DD6C0;"><svg width="12" height="12" viewBox="0 0 6 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#2A2440" d="M0 1h5v1h-5zM4 0h1v1h-1zM5 1h1v1h-1zM4 2h1v1h-1zM1 4h5v1h-5zM1 3h1v1h-1zM0 4h1v1h-1zM1 5h1v1h-1z"></path></svg></span>
              </button>
            </sc-if>
            <sc-if value="{{plain}}" hint-placeholder-val="{{ false }}">
              <button aria-label="Swap direction, now {{swapFrom}} to {{swapTo}}" onClick="{{flip}}" style="display: flex; align-items: center; gap: 7px; height: {{ctl}}; box-sizing: border-box; padding: 0 10px; font-family: 'Jua', sans-serif; font-size: {{ctlFont}}; color: #2A2440; background: transparent; border: 3px solid #2A2440; cursor: pointer;">
                <span lang="{{swapFromLang}}">{{swapFrom}}</span>
                <svg width="10" height="10" viewBox="0 0 5 5" shape-rendering="crispEdges" aria-hidden="true"><path fill="currentColor" d="M0 2h4v1h-4zM2 0h1v1h-1zM3 1h1v1h-1zM4 2h1v1h-1zM3 3h1v1h-1zM2 4h1v1h-1z"></path></svg>
                <span lang="{{swapToLang}}">{{swapTo}}</span>
              </button>
            </sc-if>
            <sc-if value="{{split}}" hint-placeholder-val="{{ false }}">
              <button aria-label="Swap direction, now {{swapFrom}} to {{swapTo}}" onClick="{{flip}}" style="display: flex; align-items: stretch; height: {{ctl}}; box-sizing: border-box; padding: 0; font-family: 'Jua', sans-serif; font-size: {{ctlFont}}; color: #2A2440; background: transparent; border: 3px solid #2A2440; cursor: pointer;">
                <span lang="{{swapFromLang}}" style="display: flex; align-items: center; padding: 0 9px;">{{swapFrom}}</span>
                <span style="display: flex; align-items: center; justify-content: center; width: 24px; border-left: 3px solid #2A2440; border-right: 3px solid #2A2440;"><svg width="12" height="12" viewBox="0 0 6 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#2A2440" d="M0 1h5v1h-5zM4 0h1v1h-1zM5 1h1v1h-1zM4 2h1v1h-1zM1 4h5v1h-5zM1 3h1v1h-1zM0 4h1v1h-1zM1 5h1v1h-1z"></path></svg></span>
                <span lang="{{swapToLang}}" style="display: flex; align-items: center; padding: 0 9px; background: #3DD6C0;">{{swapTo}}</span>
              </button>
            </sc-if>
            <sc-if value="{{arrow}}" hint-placeholder-val="{{ false }}">
              <button aria-label="Swap direction, now {{swapFrom}} to {{swapTo}}" onClick="{{flip}}" style="display: flex; align-items: center; gap: 8px; height: {{ctl}}; padding: 0 2px; font-family: 'Jua', sans-serif; font-size: {{ctlFont}}; color: #2A2440; background: transparent; border: 0; cursor: pointer;">
                <span lang="{{swapFromLang}}">{{swapFrom}}</span>
                <span style="display: flex; align-items: center; justify-content: center; width: {{ctl}}; height: {{ctl}}; box-sizing: border-box; background: #3DD6C0; border: 3px solid #2A2440;"><svg width="12" height="12" viewBox="0 0 6 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#2A2440" d="M0 1h5v1h-5zM4 0h1v1h-1zM5 1h1v1h-1zM4 2h1v1h-1zM1 4h5v1h-5zM1 3h1v1h-1zM0 4h1v1h-1zM1 5h1v1h-1z"></path></svg></span>
                <span lang="{{swapToLang}}">{{swapTo}}</span>
              </button>
            </sc-if>
            <button aria-label="How Word Strike works" style="width: {{ctl}}; height: {{ctl}}; padding: 0; font-family: 'Pixelify Sans', sans-serif; font-size: {{helpFont}}; font-weight: 700; color: #2A2440; background: transparent; border: 3px solid #2A2440; cursor: pointer;">?</button>
            <button onClick="{{selectWs}}" style="margin-left: auto; padding: 8px 22px; font-family: 'Pixelify Sans', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #000; cursor: pointer;">PLAY</button>
          </div>
        </div>
      </sc-if>
    </div>

    <div style="flex: {{gg.grow}} 1 0; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding: 22px; color: {{gg.text}}; background: {{gg.cardBg}}; border: 4px solid {{gg.border}}; box-shadow: {{gg.shadow}}; transition: flex-grow 240ms steps(4, end);">
      <button aria-label="{{gg.action}} Gap Guard" onClick="{{selectGg}}" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 16px; font: inherit; color: {{gg.pvInk}}; background: {{gg.pvBg}}; border: 4px solid {{gg.pvFrame}}; cursor: pointer;">
        <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: {{gg.promptSize}}; line-height: 1.1; white-space: nowrap;">학교<span style="display: inline-block; min-width: 1.3em; margin: 0 0.06em; color: {{gg.pvAccent}}; border-bottom: 6px solid {{gg.pvAccent}};">에</span> 가요.</span>
        <span style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 82%;">
          <span lang="ko" style="padding: 8px 0; text-align: center; font-family: 'Jua', sans-serif; font-size: {{gg.inputSize}}; background: {{gg.pvChipOn}}; border: 4px solid {{gg.pvTrack}};">에</span>
          <span lang="ko" style="padding: 8px 0; text-align: center; font-family: 'Jua', sans-serif; font-size: {{gg.inputSize}}; background: {{gg.pvPanel}}; border: 4px solid {{gg.pvTrack}};">에서</span>
          <span lang="ko" style="padding: 8px 0; text-align: center; font-family: 'Jua', sans-serif; font-size: {{gg.inputSize}}; background: {{gg.pvPanel}}; border: 4px solid {{gg.pvTrack}};">를</span>
        </span>
      </button>
      <sc-if value="{{gg.active}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
            <span style="font-family: {{nameFont}}; font-size: {{nameSize}}; font-weight: {{nameWeight}}; letter-spacing: {{nameSpacing}}; text-transform: {{nameCase}};">Gap Guard</span>
            <span style="font-size: 14px; letter-spacing: 1px; color: #6B5F7D;">BEST 0000</span>
          </div>
          <span style="font-family: {{descFont}}; font-size: {{descSize}}; line-height: 1.4; color: #4A4060;">Fill the blank in a Korean sentence. Three choices, one is right.</span>
          <div style="display: flex; align-items: center; gap: 8px;">
            <button lang="ko" aria-label="Language: Korean" style="height: {{ctl}}; box-sizing: border-box; padding: 0 10px; font-family: 'Jua', sans-serif; font-size: {{ctlFont}}; color: #2A2440; background: {{ggChipBg}}; border: 3px solid #2A2440; cursor: pointer;">한국어</button>
            <button aria-label="How Gap Guard works" style="width: {{ctl}}; height: {{ctl}}; padding: 0; font-family: 'Pixelify Sans', sans-serif; font-size: {{helpFont}}; font-weight: 700; color: #2A2440; background: transparent; border: 3px solid #2A2440; cursor: pointer;">?</button>
            <button onClick="{{selectGg}}" style="margin-left: auto; padding: 8px 22px; font-family: 'Pixelify Sans', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #000; cursor: pointer;">PLAY</button>
          </div>
        </div>
      </sc-if>
    </div>
  </div>

  <span style="font-size: 15px; letter-spacing: 1px; color: #D6C9DD;">&lt; &gt; or click to choose · Enter or click again to play</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["A","B","C"],"default":"A"},"brand":{"editor":"enum","options":["pixel","rounded"],"default":"pixel"},"picker":{"editor":"enum","options":["segment","swap","plain","split","arrow"],"default":"segment"},"compact":{"editor":"boolean","default":false},"startActive":{"editor":"enum","options":["ws","gg"],"default":"ws"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const P = "'Pixelify Sans', sans-serif";
const R = "'Jua', sans-serif";
const variant = this.props.variant || 'A';
const roundBrand = (this.props.brand || 'pixel') === 'rounded';
const picker = this.props.picker || 'segment';
const compact = this.props.compact === true || this.props.compact === 'true';
const active = this.state.active || this.props.startActive || 'ws';
const dir = this.state.dir || 'toTarget';
const roundName = variant === 'B';
const pixelDesc = variant === 'C';
const lit = {
pvBg: '#EFE6F2', pvInk: '#2A2440', pvFrame: '#EFE6F2', pvPanel: '#FBF7FC',
pvAccent: '#3DD6C0', pvTrack: '#2A2440', pvFuse: '#FFD23F', pvChipOn: '#3DD6C0'
};
const off = {
pvBg: 'transparent', pvInk: '#8A7FA6', pvFrame: '#4E4670', pvPanel: 'transparent',
pvAccent: '#6B5F7D', pvTrack: '#6B5F7D', pvFuse: '#6B5F7D', pvChipOn: '#4E4670'
};
const card = (on, big, small, bigInput, smallInput) => on
? Object.assign({}, lit, { active: true, action: 'Play', grow: '1.55', text: '#2A2440', cardBg: '#FBF7FC', border: '#FFD23F', shadow: '10px 10px 0 #FFD23F', promptSize: big, inputSize: bigInput })
: Object.assign({}, off, { active: false, action: 'Choose', grow: '1', text: '#FBF7FC', cardBg: '#332C4E', border: '#6B5F7D', shadow: 'none', promptSize: small, inputSize: smallInput });
const toKo = dir === 'toTarget';
return {
ws: card(active === 'ws', '104px', '64px', '34px', '26px'),
gg: card(active === 'gg', '76px', '44px', '26px', '20px'),
brandFont: roundBrand ? R : P,
brandSize: roundBrand ? '34px' : '30px',
brandSpacing: roundBrand ? '2px' : '5px',
nameFont: roundName ? R : P,
nameSize: roundName ? '36px' : '34px',
nameWeight: roundName ? '400' : '700',
nameSpacing: roundName ? '0' : '3px',
nameCase: roundName ? 'none' : 'uppercase',
descFont: pixelDesc ? P : R,
descSize: pixelDesc ? '16px' : '18px',
segment: picker === 'segment',
swap: picker === 'swap',
plain: picker === 'plain',
split: picker === 'split',
arrow: picker === 'arrow',
ctl: compact ? '30px' : '36px',
ctlFont: compact ? '14px' : '15px',
helpFont: compact ? '15px' : '18px',
ggChipBg: picker === 'plain' || picker === 'arrow' ? 'transparent' : '#3DD6C0',
swapFrom: toKo ? 'English' : '한국어',
swapTo: toKo ? '한국어' : 'English',
swapFromLang: toKo ? 'en' : 'ko',
swapToLang: toKo ? 'ko' : 'en',
flip: () => this.setState({ dir: toKo ? 'toBase' : 'toTarget' }),
selectWs: () => this.setState({ active: 'ws' }),
selectGg: () => this.setState({ active: 'gg' }),
onKey: (e) => {
if (e.key === 'ArrowLeft') this.setState({ active: 'ws' });
if (e.key === 'ArrowRight') this.setState({ active: 'gg' });
},
dirA: toKo ? '#3DD6C0' : 'transparent',
dirB: toKo ? 'transparent' : '#3DD6C0',
dirAOn: toKo ? 'true' : 'false',
dirBOn: toKo ? 'false' : 'true',
toTarget: () => this.setState({ dir: 'toTarget' }),
toBase: () => this.setState({ dir: 'toBase' })
};
}
}
</script>
</body>
</html>
