<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Versus duel · rival hearts on the right</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#8A7FA6}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 28px 64px 36px; display: flex; flex-direction: column; gap: 18px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <button style="padding: 6px 12px; font-family: 'Pixelify Sans', sans-serif; font-size: 16px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&lt; LEAVE</button>
    <span style="font-size: 18px; font-weight: 700; letter-spacing: 2px;">VERSUS · WORD STRIKE</span>
    <span style="margin-left: auto; font-size: 14px; letter-spacing: 2px; color: #D6C9DD;">ROOM BKTR</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 8px 8px 0 #000; color: #2A2440;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 24px 14px; border-bottom: 4px solid #EFE6F2;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #1E9C8A;">YOU</span>
        <span role="img" aria-label="You: {{youLeft}} of 3 hearts" style="display: flex; gap: 4px;">
          <sc-for list="{{youHearts}}" as="h" hint-placeholder-count="3">
            <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{h.fill}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="{{h.hl}}"></rect></svg>
          </sc-for>
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span role="img" aria-label="Guest: {{rivalLeft}} of 3 hearts" style="display: flex; gap: 4px;">
          <sc-for list="{{rivalHearts}}" as="h" hint-placeholder-count="3">
            <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{h.fill}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="{{h.hl}}"></rect></svg>
          </sc-for>
        </span>
        <span style="font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #E0284A;">GUEST</span>
      </div>
    </div>

    <div style="position: relative; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;">
      <span style="font-family: 'Jua', sans-serif; font-size: 104px; line-height: 1.1; color: {{promptColor}};">picnic</span>
      <div role="meter" aria-label="Time" aria-valuemin="0" aria-valuemax="20" aria-valuenow="{{lit}}" style="display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 3px; width: 440px; height: 12px;">
        <sc-for list="{{fuse}}" as="f" hint-placeholder-count="20">
          <span style="background: {{f.bg}};"></span>
        </sc-for>
      </div>

      <sc-if value="{{hasBand}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; gap: 14px; min-height: 64px; padding: 8px 24px; box-sizing: border-box; color: #2A2440; background: {{bandBg}}; border-top: 4px solid #2A2440;">
          <span style="font-size: 20px; font-weight: 700; letter-spacing: 2px;">{{bandLabel}}</span>
          <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 32px; line-height: 1;">{{bandWord}}</span>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; gap: 12px; padding: 16px 24px 20px; background: #EFE6F2; border-top: 4px solid #2A2440;">
      <label for="VersusDuel-answer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Your answer</label>
      <input id="VersusDuel-answer" readonly value="{{typed}}" placeholder="{{placeholder}}" lang="ko" style="flex-grow: 1; min-width: 0; padding: 12px 18px; font-family: 'Jua', sans-serif; font-size: 28px; color: #2A2440; background: #FFFFFF; border: 4px solid #2A2440; outline: none; opacity: {{inputOpacity}};">
      <button style="min-width: 150px; padding: 0 28px; font-family: 'Pixelify Sans', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440; cursor: pointer; opacity: {{inputOpacity}};">GO</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"moment":{"editor":"enum","options":["playing","you won the round","rival won the round","locked out","nobody got it"],"default":"playing"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const m = this.props.moment || 'playing';
const youLeft = m === 'rival won the round' ? 1 : 2;
const rivalLeft = m === 'you won the round' ? 1 : 2;
const lit = m === 'playing' ? 13 : m === 'locked out' ? 8 : m === 'nobody got it' ? 0 : 6;
const heart = (alive, color) => ({ fill: alive ? color : '#D6C9DD', hl: alive ? '#FFFFFF' : '#D6C9DD' });
const bands = {
'you won the round': ['#3DD6C0', 'FIRST! GUEST LOSES A HEART', '맞아요!'],
'rival won the round': ['#FF4D6D', 'GUEST GOT IT FIRST', '소풍'],
'locked out': ['#D6C9DD', 'WRONG · YOU ARE OUT THIS ROUND', ''],
'nobody got it': ['#FFD23F', 'TOO SLOW, BOTH OF YOU · IT WAS', '소풍']
};
const b = bands[m];
return {
youLeft: youLeft, rivalLeft: rivalLeft, lit: lit,
youHearts: [0, 1, 2].map((i) => heart(i < youLeft, '#3DD6C0')),
rivalHearts: [0, 1, 2].map((i) => heart(i < rivalLeft, '#FF4D6D')),
fuse: Array.from({ length: 20 }, (_, i) => ({ bg: Math.abs(i - 9.5) < lit / 2 ? '#FFD23F' : '#EFE6F2' })),
hasBand: !!b,
bandBg: b ? b[0] : '#FFD23F', bandLabel: b ? b[1] : '', bandWord: b ? b[2] : '',
promptColor: m === 'you won the round' ? '#1E9C8A' : m === 'rival won the round' ? '#E0284A' : '#2A2440',
typed: m === 'you won the round' ? '소풍' : m === 'locked out' ? '소퐁' : '',
placeholder: 'Type it in Korean',
inputOpacity: m === 'locked out' || m === 'rival won the round' ? '0.45' : '1'
};
}
}
</script>
</body>
</html>
