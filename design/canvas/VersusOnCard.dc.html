<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Versus B · VS FRIEND on Word Strike's card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#8A7FA6}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; box-sizing: border-box; padding: 32px 64px 28px; display: flex; flex-direction: column; align-items: center; gap: 24px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC; overflow: hidden;">

  <div style="align-self: stretch; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px;">
    <div style="display: flex; justify-content: flex-start;">
      <a href="#" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 0 14px 0 10px; font-size: 16px; letter-spacing: 1px; color: #FBF7FC; text-decoration: none; border: 4px solid #D6C9DD;">
        <svg width="21" height="18" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#D6C9DD" d="M0 0h3v1h-3zM4 0h3v1h-3zM0 1h1v4h-1zM3 1h1v5h-1zM6 1h1v4h-1zM0 5h3v1h-3zM4 5h3v1h-3z"></path><path fill="#FFD23F" d="M1 1h2v4h-2zM4 1h2v4h-2z"></path></svg>
        WORDBOOK
      </a>
    </div>
    <div style="display: flex; align-items: center; gap: 18px;">
      <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3DD6C0" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: 5px;">WORD DUEL</h1>
      <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FF4D6D" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
    </div>
    <div style="display: flex; justify-content: flex-end;">
      <button style="min-height: 44px; padding: 0 14px; font-family: 'Pixelify Sans', sans-serif; font-size: 16px; letter-spacing: 1px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">SIGN IN</button>
    </div>
  </div>

  <div style="flex-grow: 1; align-self: stretch; display: flex; gap: 40px; min-height: 0;">
    <section aria-label="Word Strike" style="flex: 1.55 1 0; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding: 22px; color: #2A2440; background: #FBF7FC; border: 4px solid {{cardEdge}}; box-shadow: 10px 10px 0 {{cardEdge}};">

      <sc-if value="{{isSolo}}" hint-placeholder-val="{{ false }}">
        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; background: #EFE6F2;">
          <span style="font-family: 'Jua', sans-serif; font-size: 84px; line-height: 1;">water</span>
          <span style="display: flex; align-items: center; width: 72%; box-sizing: border-box; padding: 8px 14px; background: #FBF7FC; border: 4px solid #3DD6C0;">
            <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 30px;">물</span>
            <span style="width: 4px; height: 30px; margin-left: 4px; background: #2A2440;"></span>
          </span>
        </div>
      </sc-if>

      <sc-if value="{{isVersus}}" hint-placeholder-val="{{ true }}">
        <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding: 16px; background: #EFE6F2;">
          <div style="display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 18px; background: #FBF7FC; border: 4px solid #2A2440;">
            <span style="font-size: 20px; font-weight: 700; letter-spacing: 2px;">CREATE A ROOM</span>
            <span style="font-family: 'Jua', sans-serif; font-size: 16px; line-height: 1.4; color: #4A4060;">With the direction and difficulty below. You get a code for your friend.</span>
            <button style="min-height: 52px; font-family: 'Pixelify Sans', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #000; cursor: pointer;">CREATE ROOM</button>
          </div>
          <div style="display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 18px; background: #FBF7FC; border: 4px solid #2A2440;">
            <span style="font-size: 20px; font-weight: 700; letter-spacing: 2px;">JOIN A ROOM</span>
            <label for="VersusOnCard-code" style="font-family: 'Jua', sans-serif; font-size: 16px; line-height: 1.4; color: #4A4060;">Type the 4-letter code your friend sent you.</label>
            <span style="display: flex; gap: 10px;">
              <input id="VersusOnCard-code" placeholder="BKTR" maxlength="4" style="flex-grow: 1; min-width: 0; padding: 6px 12px; font-family: 'Pixelify Sans', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 10px; text-transform: uppercase; color: #2A2440; background: #FFFFFF; border: 4px solid #2A2440; outline: none;">
              <button style="padding: 0 18px; font-family: 'Pixelify Sans', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #FBF7FC; background: #2A2440; border: 4px solid #2A2440; cursor: pointer;">JOIN</button>
            </span>
          </div>
        </div>
      </sc-if>

      <div style="display: flex; flex-direction: column; gap: 12px;">
        <span style="font-size: 34px; font-weight: 700; letter-spacing: 3px;">WORD STRIKE</span>
        <span style="font-family: 'Jua', sans-serif; font-size: 18px; line-height: 1.4; color: #4A4060;">{{blurb}}</span>
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="padding: 5px 12px; font-size: 15px; border: 3px solid #2A2440;">EN &gt; <span lang="ko">한</span></span>
          <span style="padding: 5px 12px; font-size: 15px; font-weight: 700; background: #FFD23F; border: 3px solid #2A2440;">NORMAL</span>
          <span style="width: 36px; height: 36px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; border: 3px solid #2A2440;">?</span>
          <button onClick="{{toggle}}" aria-pressed="{{pressed}}" style="margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-family: 'Pixelify Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 2px; color: {{vsFg}}; background: {{vsBg}}; border: 4px solid #2A2440; cursor: pointer;">
            <svg width="18" height="15" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{vsFg}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path></svg>
            {{vsLabel}}
          </button>
          <span style="padding: 8px 22px; font-size: 20px; font-weight: 700; letter-spacing: 2px; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #000; opacity: {{playOpacity}};">PLAY</span>
        </div>
      </div>
    </section>
    <section aria-label="Gap Guard" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; padding: 22px; color: #FBF7FC; background: #332C4E; border: 4px solid #6B5F7D;">
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 16px; color: #8A7FA6; border: 4px solid #4E4670;">
        <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 44px; line-height: 1.1; white-space: nowrap;">학교<span style="display: inline-block; min-width: 1.3em; color: #6B5F7D; border-bottom: 6px solid #6B5F7D;">에</span> 가요.</span>
      </div>
    </section>
  </div>

  <span style="font-size: 15px; letter-spacing: 1px; color: #D6C9DD;">← → choose · ↑ ↓ difficulty · V vs friend · Enter to play</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const vs = this.state.vs ?? true;
return {
isVersus: vs, isSolo: !vs,
pressed: vs ? 'true' : 'false',
cardEdge: vs ? '#FF4D6D' : '#FFD23F',
vsBg: vs ? '#FF4D6D' : '#FBF7FC',
vsFg: '#2A2440',
vsLabel: vs ? 'BACK TO SOLO' : 'VS FRIEND',
playOpacity: vs ? '0.4' : '1',
blurb: vs ? 'Race a friend: the first right answer breaks the other one’s heart.' : 'See a word, type its translation, hit Enter before time runs out.',
toggle: () => this.setState({ vs: !vs })
};
}
}
</script>
</body>
</html>
