<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Versus game over 1 · In the duel frame</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 28px 64px 36px; display: flex; flex-direction: column; gap: 18px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <button style="padding: 6px 12px; font-family: 'Pixelify Sans', sans-serif; font-size: 16px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&lt; MENU</button>
    <span style="font-size: 18px; font-weight: 700; letter-spacing: 2px;">VERSUS · WORD STRIKE</span>
    <span style="margin-left: auto; font-size: 14px; letter-spacing: 2px; color: #D6C9DD;">ROOM BKTR</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 8px 8px 0 #000; color: #2A2440;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 24px 14px; border-bottom: 4px solid #EFE6F2;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #1E9C8A;">YOU</span>
        <span role="img" aria-label="You: {{youLeft}} of 3 hearts" style="display: flex; gap: 4px;">
          <sc-for list="{{youHearts}}" as="h" hint-placeholder-count="3">
            <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{h.fill}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path></svg>
          </sc-for>
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span role="img" aria-label="Guest: {{rivalLeft}} of 3 hearts" style="display: flex; gap: 4px;">
          <sc-for list="{{rivalHearts}}" as="h" hint-placeholder-count="3">
            <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{h.fill}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path></svg>
          </sc-for>
        </span>
        <span style="font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #E0284A;">GUEST</span>
      </div>
    </div>

    <div role="status" style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 56px; align-items: center; padding: 32px 56px; background: #2A2440; color: #FBF7FC;">
      <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 16px;">
        <span style="padding: 4px 14px; font-size: 18px; font-weight: 700; letter-spacing: 3px; color: #2A2440; background: {{tagBg}};">{{tag}}</span>
        <span style="font-size: 84px; font-weight: 700; letter-spacing: 4px; line-height: 1;">{{headline}}</span>
        <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 30px; color: #D6C9DD;">{{phrase}}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <span style="font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #D6C9DD;">ROUNDS WON</span>
        <div style="display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 10px 18px; box-sizing: border-box; background: #FBF7FC; color: #2A2440; box-shadow: 4px 4px 0 #000;">
          <span style="font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #1E9C8A;">YOU</span>
          <span style="margin-left: auto; font-size: 34px; font-weight: 700;">{{youRounds}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 10px 18px; box-sizing: border-box; background: #FBF7FC; color: #2A2440; box-shadow: 4px 4px 0 #000;">
          <span style="font-size: 22px; font-weight: 700; letter-spacing: 1px; color: #E0284A;">GUEST</span>
          <span style="margin-left: auto; font-size: 34px; font-weight: 700;">{{rivalRounds}}</span>
        </div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 16px 24px 20px; background: #EFE6F2; border-top: 4px solid #2A2440;">
      <sc-if value="{{rivalAsked}}" hint-placeholder-val="{{ false }}">
        <span style="font-size: 20px; font-weight: 700; letter-spacing: 1px; color: #E0284A;">GUEST WANTS A REMATCH</span>
      </sc-if>
      <sc-if value="{{noAsk}}" hint-placeholder-val="{{ true }}">
        <span style="font-family: 'Jua', sans-serif; font-size: 20px; color: #4A4060;">Same room, same settings, fresh hearts.</span>
      </sc-if>
      <button style="margin-left: auto; min-width: 220px; min-height: 60px; padding: 0 28px; font-family: 'Pixelify Sans', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440; cursor: pointer;">REMATCH</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["win","lose"],"default":"win"},"rematch":{"editor":"enum","options":["nobody yet","rival asked"],"default":"nobody yet"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const win = (this.props.result ?? 'win') === 'win';
const asked = (this.props.rematch ?? 'nobody yet') === 'rival asked';
const youLeft = win ? 2 : 0;
const rivalLeft = win ? 0 : 1;
const heart = (alive, color) => ({ fill: alive ? color : '#D6C9DD' });
return {
youLeft: youLeft, rivalLeft: rivalLeft,
youHearts: [0, 1, 2].map((i) => heart(i < youLeft, '#3DD6C0')),
rivalHearts: [0, 1, 2].map((i) => heart(i < rivalLeft, '#FF4D6D')),
headline: win ? 'YOU WIN!' : 'YOU LOSE',
tag: win ? '2 HEARTS LEFT' : 'GUEST WINS',
tagBg: win ? '#3DD6C0' : '#FF4D6D',
phrase: win ? '잘했어요!' : '다시 해 봐요!',
youRounds: win ? '3' : '2', rivalRounds: win ? '1' : '3',
rivalAsked: asked, noAsk: !asked
};
}
}
</script>
</body>
</html>
