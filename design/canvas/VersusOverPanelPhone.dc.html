<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone · Versus game over 1</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 10px 16px; display: flex; flex-direction: column; gap: 10px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <button style="min-height: 44px; padding: 4px 10px; font-family: 'Pixelify Sans', sans-serif; font-size: 14px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&lt; MENU</button>
    <span style="font-size: 15px; font-weight: 700; letter-spacing: 2px;">VERSUS</span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 6px 6px 0 #000; color: #2A2440;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border-bottom: 4px solid #EFE6F2;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 14px; font-weight: 700; letter-spacing: 1px; color: #1E9C8A;">YOU</span>
        <span role="img" aria-label="You: {{youLeft}} of 3 hearts" style="display: flex; gap: 3px;">
          <sc-for list="{{youHearts}}" as="h" hint-placeholder-count="3">
            <svg width="24" height="21" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{h.fill}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path></svg>
          </sc-for>
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span role="img" aria-label="Guest: {{rivalLeft}} of 3 hearts" style="display: flex; gap: 3px;">
          <sc-for list="{{rivalHearts}}" as="h" hint-placeholder-count="3">
            <svg width="24" height="21" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{h.fill}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path></svg>
          </sc-for>
        </span>
        <span style="font-size: 14px; font-weight: 700; letter-spacing: 1px; color: #E0284A;">GUEST</span>
      </div>
    </div>

    <div role="status" style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 24px; padding: 20px 14px; background: #2A2440; color: #FBF7FC;">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
        <span style="padding: 3px 12px; font-size: 15px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: {{tagBg}};">{{tag}}</span>
        <span style="font-size: 52px; font-weight: 700; letter-spacing: 3px; line-height: 1;">{{headline}}</span>
        <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 24px; color: #D6C9DD;">{{phrase}}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 14px; font-weight: 700; letter-spacing: 2px; color: #D6C9DD;">ROUNDS WON</span>
        <div style="display: flex; align-items: center; min-height: 56px; padding: 8px 14px; box-sizing: border-box; background: #FBF7FC; color: #2A2440; box-shadow: 4px 4px 0 #000;">
          <span style="font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #1E9C8A;">YOU</span>
          <span style="margin-left: auto; font-size: 28px; font-weight: 700;">{{youRounds}}</span>
        </div>
        <div style="display: flex; align-items: center; min-height: 56px; padding: 8px 14px; box-sizing: border-box; background: #FBF7FC; color: #2A2440; box-shadow: 4px 4px 0 #000;">
          <span style="font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #E0284A;">GUEST</span>
          <span style="margin-left: auto; font-size: 28px; font-weight: 700;">{{rivalRounds}}</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #EFE6F2; border-top: 4px solid #2A2440;">
      <sc-if value="{{rivalAsked}}" hint-placeholder-val="{{ false }}">
        <span style="text-align: center; font-size: 15px; font-weight: 700; letter-spacing: 1px; color: #E0284A;">GUEST WANTS A REMATCH</span>
      </sc-if>
      <button style="min-height: 54px; font-family: 'Pixelify Sans', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440; cursor: pointer;">REMATCH</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"result":{"editor":"enum","options":["win","lose"],"default":"win"},"rematch":{"editor":"enum","options":["nobody yet","rival asked"],"default":"nobody yet"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const win = (this.props.result ?? 'win') === 'win';
const asked = (this.props.rematch ?? 'nobody yet') === 'rival asked';
const youLeft = win ? 2 : 0;
const rivalLeft = win ? 0 : 1;
const heart = (alive, color) => ({ fill: alive ? color : '#D6C9DD' });
return {
youLeft: youLeft, rivalLeft: rivalLeft,
youHearts: [0, 1, 2].map((i) => heart(i < youLeft, '#3DD6C0')),
rivalHearts: [0, 1, 2].map((i) => heart(i < rivalLeft, '#FF4D6D')),
headline: win ? 'YOU WIN!' : 'YOU LOSE',
tag: win ? '2 HEARTS LEFT' : 'GUEST WINS',
tagBg: win ? '#3DD6C0' : '#FF4D6D',
phrase: win ? '잘했어요!' : '다시 해 봐요!',
youRounds: win ? '3' : '2', rivalRounds: win ? '1' : '3',
rivalAsked: asked
};
}
}
</script>
</body>
</html>
