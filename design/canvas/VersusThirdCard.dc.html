<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Versus C · A third VERSUS card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#8A7FA6}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; box-sizing: border-box; padding: 32px 64px 28px; display: flex; flex-direction: column; align-items: center; gap: 24px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC; overflow: hidden;">

  <div style="align-self: stretch; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 24px;">
    <div style="display: flex; justify-content: flex-start;">
      <a href="#" style="display: flex; align-items: center; gap: 10px; min-height: 44px; box-sizing: border-box; padding: 0 14px 0 10px; font-size: 16px; letter-spacing: 1px; color: #FBF7FC; text-decoration: none; border: 4px solid #D6C9DD;">
        <svg width="21" height="18" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#D6C9DD" d="M0 0h3v1h-3zM4 0h3v1h-3zM0 1h1v4h-1zM3 1h1v5h-1zM6 1h1v4h-1zM0 5h3v1h-3zM4 5h3v1h-3z"></path><path fill="#FFD23F" d="M1 1h2v4h-2zM4 1h2v4h-2z"></path></svg>
        WORDBOOK
      </a>
    </div>
    <div style="display: flex; align-items: center; gap: 18px;">
      <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3DD6C0" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: 5px;">WORD DUEL</h1>
      <svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FF4D6D" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#fff"></rect></svg>
    </div>
    <div style="display: flex; justify-content: flex-end;">
      <button style="min-height: 44px; padding: 0 14px; font-family: 'Pixelify Sans', sans-serif; font-size: 16px; letter-spacing: 1px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">SIGN IN</button>
    </div>
  </div>

  <div style="flex-grow: 1; align-self: stretch; display: flex; gap: 28px; min-height: 0;">

    <button onClick="{{pickStrike}}" aria-label="Word Strike" style="flex: {{strikeFlex}}; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px; text-align: left; font: inherit; color: {{strikeFg}}; background: {{strikeBg}}; border: 4px solid {{strikeEdge}}; box-shadow: {{strikeShadow}}; cursor: pointer;">
      <span style="flex-grow: 1; align-self: stretch; display: flex; align-items: center; justify-content: center; padding: 12px; border: 4px solid {{strikeInner}};">
        <span style="font-family: 'Jua', sans-serif; font-size: 56px; line-height: 1;">water</span>
      </span>
      <span style="font-size: 26px; font-weight: 700; letter-spacing: 2px;">WORD STRIKE</span>
      <sc-if value="{{strikeOn}}" hint-placeholder-val="{{ false }}">
        <span style="display: flex; align-items: center; gap: 10px;">
          <span style="padding: 5px 12px; font-size: 15px; border: 3px solid #2A2440;">EN &gt; <span lang="ko">한</span></span>
          <span style="padding: 5px 12px; font-size: 15px; font-weight: 700; background: #FFD23F; border: 3px solid #2A2440;">NORMAL</span>
          <span style="margin-left: auto; padding: 8px 22px; font-size: 20px; font-weight: 700; letter-spacing: 2px; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #000;">PLAY</span>
        </span>
      </sc-if>
    </button>

    <div aria-label="Gap Guard" style="flex: 0.7 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px; color: #8A7FA6; background: #332C4E; border: 4px solid #6B5F7D;">
      <span style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding: 12px; border: 4px solid #4E4670;">
        <span lang="ko" style="font-family: 'Jua', sans-serif; font-size: 34px; line-height: 1.1; white-space: nowrap;">학교<span style="display: inline-block; min-width: 1.3em; color: #6B5F7D; border-bottom: 5px solid #6B5F7D;">에</span> 가요.</span>
      </span>
      <span style="font-size: 26px; font-weight: 700; letter-spacing: 2px; color: #D6C9DD;">GAP GUARD</span>
    </div>

    <section aria-label="Versus" onClick="{{pickVersus}}" style="flex: {{vsFlex}}; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px; color: {{vsFg}}; background: {{vsBg}}; border: 4px solid {{vsEdge}}; box-shadow: {{vsShadow}}; cursor: pointer;">
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 22px; padding: 12px; background: {{vsInnerBg}};">
        <span style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <span style="font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #1E9C8A;">YOU</span>
          <span style="display: flex; gap: 3px;">
            <sc-for list="{{three}}" as="h" hint-placeholder-count="3"><svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3DD6C0" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path></svg></sc-for>
          </span>
        </span>
        <span style="font-size: 36px; font-weight: 700; letter-spacing: 2px;">VS</span>
        <span style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <span style="font-size: 16px; font-weight: 700; letter-spacing: 2px; color: #E0284A;">FRIEND</span>
          <span style="display: flex; gap: 3px;">
            <sc-for list="{{three}}" as="h" hint-placeholder-count="3"><svg width="28" height="24" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#FF4D6D" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path></svg></sc-for>
          </span>
        </span>
      </div>
      <span style="font-size: 26px; font-weight: 700; letter-spacing: 2px;">VERSUS</span>
      <sc-if value="{{vsOn}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <span style="font-family: 'Jua', sans-serif; font-size: 17px; line-height: 1.4; color: #4A4060;">Race a friend on Word Strike, with its direction and difficulty.</span>
          <span style="display: flex; gap: 8px;">
            <span style="padding: 4px 10px; font-size: 14px; border: 3px solid #2A2440;">EN &gt; <span lang="ko">한</span></span>
            <span style="padding: 4px 10px; font-size: 14px; border: 3px solid #2A2440;">NORMAL</span>
          </span>
          <button style="min-height: 50px; font-family: 'Pixelify Sans', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #000; cursor: pointer;">CREATE ROOM</button>
          <label for="VersusThirdCard-code" style="font-size: 14px; letter-spacing: 1px; color: #6B5F7D;">OR JOIN WITH A CODE</label>
          <span style="display: flex; gap: 10px;">
            <input id="VersusThirdCard-code" placeholder="BKTR" maxlength="4" style="flex-grow: 1; min-width: 0; padding: 4px 12px; font-family: 'Pixelify Sans', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 10px; text-transform: uppercase; color: #2A2440; background: #FFFFFF; border: 4px solid #2A2440; outline: none;">
            <button style="padding: 0 18px; font-family: 'Pixelify Sans', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #FBF7FC; background: #2A2440; border: 4px solid #2A2440; cursor: pointer;">JOIN</button>
          </span>
        </div>
      </sc-if>
    </section>
  </div>

  <span style="font-size: 15px; letter-spacing: 1px; color: #D6C9DD;">← → choose · Enter to play</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const vs = (this.state.active ?? 'versus') === 'versus';
return {
three: [0, 1, 2],
vsOn: vs, strikeOn: !vs,
vsFlex: vs ? '1.5 1 0' : '0.7 1 0',
strikeFlex: vs ? '0.7 1 0' : '1.5 1 0',
vsBg: vs ? '#FBF7FC' : '#332C4E', vsFg: vs ? '#2A2440' : '#D6C9DD',
vsEdge: vs ? '#FF4D6D' : '#6B5F7D', vsShadow: vs ? '10px 10px 0 #FF4D6D' : 'none',
vsInnerBg: vs ? '#EFE6F2' : 'transparent',
strikeBg: vs ? '#332C4E' : '#FBF7FC', strikeFg: vs ? '#8A7FA6' : '#2A2440',
strikeEdge: vs ? '#6B5F7D' : '#FFD23F', strikeShadow: vs ? 'none' : '10px 10px 0 #FFD23F',
strikeInner: vs ? '#4E4670' : '#EFE6F2',
pickVersus: () => this.setState({ active: 'versus' }),
pickStrike: () => this.setState({ active: 'strike' })
};
}
}
</script>
</body>
</html>
