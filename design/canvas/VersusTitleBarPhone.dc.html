<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone · Versus A · VS in the title bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#8A7FA6}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 20px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC; overflow: hidden;">

  <div style="display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; align-items: center; gap: 8px;">
    <a href="#" aria-label="Wordbook" style="width: 44px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 4px solid #D6C9DD;">
      <svg width="21" height="18" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#D6C9DD" d="M0 0h3v1h-3zM4 0h3v1h-3zM0 1h1v4h-1zM3 1h1v5h-1zM6 1h1v4h-1zM0 5h3v1h-3zM4 5h3v1h-3z"></path><path fill="#FFD23F" d="M1 1h2v4h-2zM4 1h2v4h-2z"></path></svg>
    </a>
    <h1 style="margin: 0; text-align: center; font-size: 18px; font-weight: 700; letter-spacing: 2px; white-space: nowrap;">WORD DUEL</h1>
    <span style="display: flex; gap: 6px;">
      <button onClick="{{open}}" aria-label="Versus" style="min-height: 44px; padding: 0 10px; font-family: 'Pixelify Sans', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 1px; color: #2A2440; background: #FF4D6D; border: 4px solid #FF4D6D; cursor: pointer;">VS</button>
      <button style="min-height: 44px; padding: 0 8px; font-family: 'Pixelify Sans', sans-serif; font-size: 13px; letter-spacing: 1px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">SIGN IN</button>
    </span>
  </div>

  <section aria-label="Word Strike" style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 16px; color: #2A2440; background: #FBF7FC; border: 4px solid #FFD23F; box-shadow: 8px 8px 0 #FFD23F;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px; background: #EFE6F2;">
      <span style="font-family: 'Jua', sans-serif; font-size: 56px; line-height: 1;">water</span>
    </div>
    <span style="font-size: 28px; font-weight: 700; letter-spacing: 2px;">WORD STRIKE</span>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="padding: 5px 10px; font-size: 14px; border: 3px solid #2A2440;">EN &gt; <span lang="ko">한</span></span>
      <span style="padding: 5px 10px; font-size: 14px; font-weight: 700; background: #FFD23F; border: 3px solid #2A2440;">NORMAL</span>
      <span style="margin-left: auto; padding: 8px 20px; font-size: 18px; font-weight: 700; letter-spacing: 2px; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #000;">PLAY</span>
    </div>
  </section>

  <sc-if value="{{isOpen}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(20,16,34,0.78);">
      <section role="dialog" aria-label="Versus" style="display: flex; flex-direction: column; gap: 16px; padding: 20px 16px 24px; color: #2A2440; background: #FBF7FC; border-top: 4px solid #FF4D6D;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="font-size: 26px; font-weight: 700; letter-spacing: 2px;">VERSUS</span>
          <button onClick="{{close}}" aria-label="Close" style="margin-left: auto; width: 44px; height: 44px; font-family: 'Pixelify Sans', sans-serif; font-size: 18px; font-weight: 700; color: #2A2440; background: transparent; border: 4px solid #2A2440; cursor: pointer;">X</button>
        </div>
        <span style="font-family: 'Jua', sans-serif; font-size: 16px; line-height: 1.4; color: #4A4060;">Race a friend on Word Strike. First right answer breaks a heart.</span>
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #EFE6F2;">
          <span style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 17px; font-weight: 700; letter-spacing: 1px;">CREATE A ROOM</span>
            <span style="margin-left: auto; padding: 3px 8px; font-size: 12px; border: 3px solid #2A2440;">EN &gt; <span lang="ko">한</span> · NORMAL</span>
          </span>
          <button style="min-height: 50px; font-family: 'Pixelify Sans', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #000; cursor: pointer;">CREATE ROOM</button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #EFE6F2;">
          <label for="VersusTitleBarPhone-code" style="font-size: 17px; font-weight: 700; letter-spacing: 1px;">JOIN WITH A CODE</label>
          <span style="display: flex; gap: 8px;">
            <input id="VersusTitleBarPhone-code" placeholder="BKTR" maxlength="4" style="flex-grow: 1; min-width: 0; padding: 4px 10px; font-family: 'Pixelify Sans', sans-serif; font-size: 28px; font-weight: 700; letter-spacing: 10px; text-transform: uppercase; color: #2A2440; background: #FFFFFF; border: 4px solid #2A2440; outline: none;">
            <button style="padding: 0 16px; font-family: 'Pixelify Sans', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #FBF7FC; background: #2A2440; border: 4px solid #2A2440; cursor: pointer;">JOIN</button>
          </span>
        </div>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const isOpen = this.state.open ?? true;
return {
isOpen: isOpen,
open: () => this.setState({ open: true }),
close: () => this.setState({ open: false })
};
}
}
</script>
</body>
</html>
