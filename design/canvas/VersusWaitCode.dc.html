<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Versus waiting 1 · Code fills the duel board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&amp;family=Jua&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#8A7FA6}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0.25}}
.blink{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion: reduce){.blink{animation:none}}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 28px 64px 36px; display: flex; flex-direction: column; gap: 18px; background-color: #2A2440; background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 16px 16px; font-family: 'Pixelify Sans', sans-serif; color: #FBF7FC;">

  <div style="display: flex; align-items: center; gap: 14px;">
    <button style="padding: 6px 12px; font-family: 'Pixelify Sans', sans-serif; font-size: 16px; color: #FBF7FC; background: transparent; border: 4px solid #D6C9DD; cursor: pointer;">&lt; MENU</button>
    <span style="font-size: 18px; font-weight: 700; letter-spacing: 2px;">VERSUS · WORD STRIKE</span>
    <span style="margin-left: auto; display: flex; gap: 8px;">
      <span style="padding: 4px 10px; font-size: 14px; border: 3px solid #D6C9DD;">EN &gt; <span lang="ko">한</span></span>
      <span style="padding: 4px 10px; font-size: 14px; border: 3px solid #D6C9DD;">NORMAL</span>
    </span>
  </div>

  <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: #FBF7FC; border: 4px solid #2A2440; box-shadow: 8px 8px 0 #000; color: #2A2440;">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 16px 24px 14px; border-bottom: 4px solid #EFE6F2;">
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #1E9C8A;">YOU</span>
        <span role="img" aria-label="You: 3 of 3 hearts" style="display: flex; gap: 4px;">
          <sc-for list="{{three}}" as="h" hint-placeholder-count="3">
            <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="#3DD6C0" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path><rect x="1" y="1" width="1" height="1" fill="#FFFFFF"></rect></svg>
          </sc-for>
        </span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span role="img" aria-label="{{rivalAria}}" style="display: flex; gap: 4px;">
          <sc-for list="{{three}}" as="h" hint-placeholder-count="3">
            <svg width="35" height="30" viewBox="0 0 7 6" shape-rendering="crispEdges" aria-hidden="true"><path fill="{{rivalFill}}" d="M1 0h2v1h-2zM4 0h2v1h-2zM0 1h7v2h-7zM1 3h5v1h-5zM2 4h3v1h-3zM3 5h1v1h-1z"></path></svg>
          </sc-for>
        </span>
        <sc-if value="{{isWaiting}}" hint-placeholder-val="{{ true }}">
          <span class="blink" style="font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #8A7FA6;">WAITING…</span>
        </sc-if>
        <sc-if value="{{isJoined}}" hint-placeholder-val="{{ false }}">
          <span style="font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #E0284A;">GUEST</span>
        </sc-if>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;">
      <sc-if value="{{isWaiting}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
          <span style="font-size: 16px; font-weight: 700; letter-spacing: 3px; color: #6B5F7D;">ROOM CODE</span>
          <span role="img" aria-label="Room code B K T R" style="display: flex; gap: 14px;">
            <sc-for list="{{code}}" as="c" hint-placeholder-count="4">
              <span aria-hidden="true" style="width: 110px; height: 130px; display: flex; align-items: center; justify-content: center; font-size: 96px; font-weight: 700; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 6px 6px 0 #2A2440;">{{c}}</span>
            </sc-for>
          </span>
          <span style="font-family: 'Jua', sans-serif; font-size: 22px; color: #4A4060;">Send your friend the code, or the link.</span>
          <button style="display: flex; align-items: center; gap: 10px; padding: 10px 22px; font-family: 'Pixelify Sans', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #FBF7FC; background: #2A2440; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #000; cursor: pointer;">COPY LINK</button>
        </div>
      </sc-if>
      <sc-if value="{{isJoined}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
          <span style="font-size: 26px; font-weight: 700; letter-spacing: 2px; color: #E0284A;">GUEST JOINED</span>
          <span style="font-size: 200px; font-weight: 700; line-height: 1;">3</span>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; gap: 12px; padding: 16px 24px 20px; background: #EFE6F2; border-top: 4px solid #2A2440;">
      <label for="VersusWaitCode-answer" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%);">Your answer</label>
      <input id="VersusWaitCode-answer" readonly disabled placeholder="{{placeholder}}" lang="ko" style="flex-grow: 1; min-width: 0; padding: 12px 18px; font-family: 'Jua', sans-serif; font-size: 28px; color: #2A2440; background: #FFFFFF; border: 4px solid #2A2440; outline: none; opacity: 0.5;">
      <button disabled style="min-width: 150px; padding: 0 28px; font-family: 'Pixelify Sans', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 2px; color: #2A2440; background: #FFD23F; border: 4px solid #2A2440; box-shadow: 4px 4px 0 #2A2440; opacity: 0.5;">GO</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"moment":{"editor":"enum","options":["waiting","joined"],"default":"waiting"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const joined = (this.props.moment ?? 'waiting') === 'joined';
return {
isWaiting: !joined, isJoined: joined,
three: [0, 1, 2],
code: ['B', 'K', 'T', 'R'],
rivalFill: joined ? '#FF4D6D' : '#D6C9DD',
rivalAria: joined ? 'Guest: 3 of 3 hearts' : 'Waiting for your friend',
placeholder: joined ? 'Get ready…' : 'Waiting for your friend…'
};
}
}
</script>
</body>
</html>
